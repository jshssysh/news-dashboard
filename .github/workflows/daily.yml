name: update-data

on:
  schedule:
    # 운영 기준: 사용자가 07:00~08:00에 전날 뉴스/법안을 정리해 08:00경 발송한다.
    # 따라서 모든 수집은 08:00 이전에 끝나야 의미가 있다(08시 넘어 도는 실행은 소용없음).
    #
    # 국회 계류의안 API는 전날 발의분을 다음날 아침에야 반영하는데, 그 시각이 날마다
    # 흔들린다(실측: 8/26은 07:32엔 없다가 08:23에 나타남 / 8/27은 07:34에 이미 있었음).
    # 06:07 한 번만으로는 놓치는 날이 생기므로, 발송 직전까지 법안만 두 번 더 받는다.
    # 법안 수집은 1~2분이고 이미 요약된 건은 캐시를 재사용하므로 추가 비용이 거의 없다.
    #
    # 정각(및 정각 직후)은 GitHub Actions 요청이 몰려 예약 실행이 지연/누락되므로
    # (공식 문서에 명시된 동작, 실제로 같은 날 두 예약이 모두 누락된 적 있음)
    # 모든 시각을 정각에서 비켜 잡았다.
    - cron: '7 21 * * *'   # KST 06:07 - 뉴스 + 법안 (본 수집, 06:40경 완료)
    - cron: '12 22 * * *'  # KST 07:12 - 법안만 (일찍 반영된 날 잡기)
    - cron: '47 22 * * *'  # KST 07:47 - 법안만 (발송 직전 마지막, 07:50경 완료)
  workflow_dispatch:
    inputs:
      skip_ai:
        description: '체크 시 AI 분석 건너뛰기 (개발/UI 테스트용 - 빠르고 무료, 분류 없이 원본만 수집). 평소엔 체크 해제 상태로 실행하세요.'
        required: false
        type: boolean
        default: false
      skip_bills:
        description: '체크 시 계류 법안 수집 건너뛰기 (개발/UI 테스트용 - 법안은 하루 한 번이면 충분해서 반복 테스트할 땐 API 호출 절약). 평소엔 체크 해제 상태로 실행하세요.'
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필수 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas pyyaml beautifulsoup4  # 수집 스크립트에 필요한 것만 설치 (streamlit은 앱 전용)

      - name: 파이썬 스크립트 실행 (API 키 매핑 필수)
        # 07:12 / 07:47은 법안 전용 재수집이므로 뉴스(및 Gemini 분석)는 건너뛴다.
        # 여기 cron 문자열이 위 schedule과 어긋나면 법안 전용 실행에서 뉴스까지 돌아버린다.
        if: github.event.schedule != '12 22 * * *' && github.event.schedule != '47 22 * * *'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          SKIP_AI_ANALYSIS: ${{ github.event.inputs.skip_ai }}
        run: |
          python main.py

      - name: 계류 법안 수집 (국회 열린국회정보 Open API)
        if: github.event.inputs.skip_bills != 'true'  # 06:07/07:12/07:47 세 번 다 수집 (한 번 실패해도 앞선 수집분이 남도록)
        env:
          ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python collect_bills.py

      - name: 정적 대시보드(docs/index.html) 생성
        run: |
          python generate_html.py

      - name: 결과 CSV + 정적 대시보드 깃허브에 커밋 및 푸시
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add news_list.csv bill_list.csv docs/index.html
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "Update news data"
            # 이 스크립트가 실행되는 동안 다른 커밋(예: app.py 수정)이 먼저 푸시되어
            # main이 앞서 있으면 그냥 push하면 거부되므로, 먼저 최신 내용을 받아온 뒤 푸시한다.
            # news_list.csv/bill_list.csv/docs/index.html은 매번 스크립트가 통째로 새로
            # 만들어내는 자동 생성 파일이라, 충돌이 나면 "지금 막 새로 만든 것"이 항상
            # 정답이다 - rebase 대신 merge를 쓰고, 이 파일들 충돌은 우리 쪽(ours)으로 해결한다.
            git fetch origin main
            if ! git merge origin/main --no-edit; then
              conflicted=$(git diff --name-only --diff-filter=U)
              echo "::warning::자동 생성 파일에서 병합 충돌 발생 - 이번 실행 결과로 덮어써서 해결함: $conflicted"
              git checkout --ours -- news_list.csv bill_list.csv docs/index.html
              git add news_list.csv bill_list.csv docs/index.html
              git commit --no-edit
            fi
            if ! git push; then
              echo "::error::git push 실패 - 이번 실행 결과가 원격에 반영되지 않았습니다. 로그를 확인하세요."
              exit 1
            fi
          fi
