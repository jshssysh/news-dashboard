name: update-data

on:
  schedule:
    - cron: '30 21 * * *'  # 매일 한국시간(KST, UTC+9) 06:30 실행 (항상 AI 분석 포함)
  workflow_dispatch:
    inputs:
      skip_ai:
        description: '체크 시 AI 분석 건너뛰기 (개발/UI 테스트용 - 빠르고 무료, 분류 없이 원본만 수집). 평소엔 체크 해제 상태로 실행하세요.'
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필수 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas pyyaml  # 수집 스크립트에 필요한 것만 설치 (streamlit은 앱 전용)

      - name: 파이썬 스크립트 실행 (API 키 매핑 필수)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          SKIP_AI_ANALYSIS: ${{ github.event.inputs.skip_ai }}
        run: |
          python main.py

      - name: 결과 CSV 파일 깃허브에 커밋 및 푸시
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add news_list.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update news data" && git push)
