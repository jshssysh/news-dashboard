name: update-data

on:
  schedule:
    - cron: '0 21 * * *'  # 매일 한국시간(KST, UTC+9) 06:00 실행 (항상 AI 분석 포함)
  workflow_dispatch:
    inputs:
      skip_ai:
        description: '체크 시 AI 분석 건너뛰기 (개발/UI 테스트용 - 빠르고 무료, 분류 없이 원본만 수집). 평소엔 체크 해제 상태로 실행하세요.'
        required: false
        type: boolean
        default: false
      skip_bills:
        description: '체크 시 계류 법안 수집 건너뛰기 (개발/UI 테스트용 - 법안은 하루 한 번이면 충분해서 반복 테스트할 땐 API 호출 절약). 평소엔 체크 해제 상태로 실행하세요.'
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필수 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas pyyaml beautifulsoup4  # 수집 스크립트에 필요한 것만 설치 (streamlit은 앱 전용)

      - name: 파이썬 스크립트 실행 (API 키 매핑 필수)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          SKIP_AI_ANALYSIS: ${{ github.event.inputs.skip_ai }}
        run: |
          python main.py

      - name: 계류 법안 수집 (국회 열린국회정보 Open API)
        if: github.event.inputs.skip_bills != 'true'
        env:
          ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python collect_bills.py

      - name: 정적 대시보드(docs/index.html) 생성
        run: |
          python generate_html.py

      - name: 결과 CSV + 정적 대시보드 깃허브에 커밋 및 푸시
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add news_list.csv bill_list.csv docs/index.html
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "Update news data"
            # 이 스크립트가 실행되는 동안 다른 커밋(예: app.py 수정)이 먼저 푸시되어
            # main이 앞서 있으면 그냥 push하면 거부되므로, 먼저 최신 내용을 받아온 뒤 푸시한다.
            # news_list.csv/bill_list.csv/docs/index.html은 매번 스크립트가 통째로 새로
            # 만들어내는 자동 생성 파일이라, 충돌이 나면 "지금 막 새로 만든 것"이 항상
            # 정답이다 - rebase 대신 merge를 쓰고, 이 파일들 충돌은 우리 쪽(ours)으로 해결한다.
            git fetch origin main
            if ! git merge origin/main --no-edit; then
              conflicted=$(git diff --name-only --diff-filter=U)
              echo "::warning::자동 생성 파일에서 병합 충돌 발생 - 이번 실행 결과로 덮어써서 해결함: $conflicted"
              git checkout --ours -- news_list.csv bill_list.csv docs/index.html
              git add news_list.csv bill_list.csv docs/index.html
              git commit --no-edit
            fi
            if ! git push; then
              echo "::error::git push 실패 - 이번 실행 결과가 원격에 반영되지 않았습니다. 로그를 확인하세요."
              exit 1
            fi
          fi
