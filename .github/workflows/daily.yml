name: update-data

on:
  # [2026-09-01] GitHub 자체 schedule cron이 며칠째 계속 지연/누락돼서(8/21~8/27
  # 관찰 기록 참고 - 삭제된 예전 주석에 남아있음) 못 믿기로 하고, cron-job.org가
  # workflow_dispatch를 정해진 시각(06:01/07:12/07:47/12:01/18:01 KST)에 직접
  # 호출하는 방식으로 완전히 옮겼다. 그래서 schedule 트리거는 더 없다 - 아래
  # 스텝들의 건너뛰기 조건도 workflow_dispatch 입력만 본다.
  workflow_dispatch:
    # 체크 항목은 전부 "체크하면 동작": [건너뛰기]는 그 수집을 빼고, [지금 바로 수집]은
    # 정해진 시각까지 기다리지 않고 바로 돈다. 아무것도 체크 안 하면 평소대로 전부 돈다.
    # 입력 이름(skip_*)은 cron-job.org 호출이 쓰므로 바꾸지 않고 설명만 고친다.
    inputs:
      skip_news:
        description: '[건너뛰기] 뉴스 수집 + AI 분석 전체. 법안만 다시 받을 때 이것만 체크 (cron-job.org의 07:12/07:47 "법안만 재확인" 실행도 이 값을 씀)'
        required: false
        type: boolean
        default: false
      skip_ai:
        description: '[건너뛰기] 뉴스 AI 분석(Gemini)만. 뉴스 수집은 함 (테스트용)'
        required: false
        type: boolean
        default: false
      skip_bills:
        description: '[건너뛰기] 법안 + 의원 정보 수집 (테스트용)'
        required: false
        type: boolean
        default: false
      skip_member_news:
        description: '[건너뛰기] 의원별 뉴스 수집 (테스트용)'
        required: false
        type: boolean
        default: false
      skip_decisions:
        description: '[건너뛰기] 심·판결 수집 (테스트용)'
        required: false
        type: boolean
        default: false
      skip_decisions_wait:
        description: '[지금 바로 수집] 심·판결 - 평소엔 토요일 06시대에만 수집. 체크하면 시간 상관없이 지금 수집'
        required: false
        type: boolean
        default: false
      decisions_lookback_days:
        description: '[심·판결 숫자 입력] 며칠치를 훑을지. 평소엔 비워 두세요 (비우면 쌓인 데이터의 가장 오래된 날짜까지 다시 훑어 늦게 공개된 결정문도 채움). 예: 500 = 22대 국회 임기 시작 무렵부터'
        required: false
        type: string
        default: ''
      skip_law_penalties:
        description: '[건너뛰기] 법령 벌칙·과징금 + 법령 공포·시행 + 입법예고 수집 (테스트용). 아래 ''지금 바로 수집''과 같이 체크하면 수집 안 됨'
        required: false
        type: boolean
        default: false
      skip_law_penalties_wait:
        description: '[지금 바로 수집] 법령 벌칙·과징금(평소 토요일 06시대) + 법령 공포·시행·입법예고(평소 매일 06시대). 체크하면 시간 상관없이 지금 수집'
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 기사 임베딩 벡터(.cache/embeddings.json.gz)를 실행 사이에 보관한다. 저장소에 커밋하면
      # 매번 수 MB가 다시 올라가 저장소가 커지므로 Actions 캐시를 쓴다(main.py EMBED_CACHE_PATH).
      # 키가 실행마다 달라 매번 새로 저장되고, 복원은 가장 최근 것을 쓴다.
      - name: 임베딩 캐시 복원
        uses: actions/cache@v4
        with:
          path: .cache
          key: embed-${{ github.run_id }}
          restore-keys: |
            embed-

      - name: 필수 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 뉴스 수집 + AI 분석 (네이버 API + Gemini)
        # 07:12 / 07:47(법안 전용 재수집)은 cron-job.org가 skip_news=true로 호출한다.
        if: github.event.inputs.skip_news != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          SKIP_AI_ANALYSIS: ${{ github.event.inputs.skip_ai }}
        run: |
          python main.py

      - name: 법안 + 의원 정보 수집 (국회 열린국회정보 Open API)
        if: ${{ !cancelled() && github.event.inputs.skip_bills != 'true' }}
        env:
          ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python collect_bills.py

      - name: 의원별 뉴스 수집 (네이버 API + Gemini)
        # member_list.csv는 저장소에 커밋된 파일이라 위 스텝을 건너뛰어도(skip_bills)
        # 예전 것이 그대로 있으므로, 이 스텝은 skip_member_news로 따로 켜고 끈다.
        # 07:12 / 07:47 "법안만 재확인" 실행(skip_news=true)에서는 같이 건너뛴다 - 같은
        # 네이버 검색+Gemini 분류를 하루 5번 전부 돌릴 필요가 없다.
        if: ${{ !cancelled() && github.event.inputs.skip_member_news != 'true' && github.event.inputs.skip_news != 'true' }}
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python collect_member_news.py

      - name: 심·판결 수집 (법제처 국가법령정보 Open API + Gemini)
        # 이 스텝 자체는 다른 스텝들처럼 매번(하루 5번) 실행되지만, 의결서/판례는
        # 주 1회만 확인해도 충분해서 collect_decisions.py 안에서 "토요일 06시대가
        # 아니면 바로 종료"하도록 자체적으로 걸러낸다 - 여기 조건문은 그대로 둔다.
        if: ${{ !cancelled() && github.event.inputs.skip_decisions != 'true' }}
        env:
          LAW_GO_KR_OC: ${{ secrets.LAW_GO_KR_OC }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DECISIONS_SKIP_WAIT: ${{ github.event.inputs.skip_decisions_wait }}
          DECISIONS_LOOKBACK_DAYS: ${{ github.event.inputs.decisions_lookback_days }}
        run: |
          python collect_decisions.py

      - name: 법령 벌칙/과징금 수집 (법제처 국가법령정보 Open API)
        # 이 스텝 자체는 다른 스텝들처럼 매번(하루 5번) 실행되지만, 법 개정도
        # 심·판결처럼 일주일에 몇 건 안 돼서 collect_law_penalties.py 안에서
        # "토요일 06시대가 아니면 바로 종료"하도록 자체적으로 걸러낸다 - 여기
        # 조건문은 그대로 둔다.
        if: ${{ !cancelled() && github.event.inputs.skip_law_penalties != 'true' }}
        env:
          LAW_GO_KR_OC: ${{ secrets.LAW_GO_KR_OC }}
          LAW_PENALTIES_SKIP_WAIT: ${{ github.event.inputs.skip_law_penalties_wait }}
        run: |
          python collect_law_penalties.py

      - name: 법률·시행령·시행규칙 공포·시행 이력 수집 (법제처 국가법령정보 Open API)
        # workflow_dispatch 입력은 10개가 한도라(이미 9개) 새 입력을 만들지 않고
        # [법령] 입력 두 개(skip_law_penalties / skip_law_penalties_wait)를 같이 쓴다.
        # 06시대 실행이 아니면 collect_subordinate_laws.py가 바로 종료한다.
        if: ${{ !cancelled() && github.event.inputs.skip_law_penalties != 'true' }}
        env:
          LAW_GO_KR_OC: ${{ secrets.LAW_GO_KR_OC }}
          SUBORDINATE_LAWS_SKIP_WAIT: ${{ github.event.inputs.skip_law_penalties_wait }}
        run: |
          python collect_subordinate_laws.py

      - name: 입법예고 수집 (법제처 국민참여입법센터)
        # 법령 공포·시행 수집과 같은 입력·시각(06시대)으로 돈다. 목록을 못 받으면 기존 파일을 둔다.
        if: ${{ !cancelled() && github.event.inputs.skip_law_penalties != 'true' }}
        env:
          SUBORDINATE_LAWS_SKIP_WAIT: ${{ github.event.inputs.skip_law_penalties_wait }}
        run: |
          python collect_legislative_notices.py

      - name: 정적 대시보드(docs/) 생성
        # 앞 수집 스텝 하나가 실패해도(예: 뉴스 CSV를 못 읽어 저장을 중단) 나머지 스텝의
        # 결과는 커밋되게 한다. 실패한 스텝이 있으면 잡은 끝에 실패로 표시된다.
        if: ${{ !cancelled() }}
        run: |
          python generate_html.py

      - name: 결과 CSV + 정적 대시보드 깃허브에 커밋 및 푸시
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # 파일마다 존재 여부를 확인하고 add 한다. 한 번에 나열해서 add 하면 그 중
          # 하나라도 없을 때(예: member_list.csv 생성이 실패한 실행) "did not match
          # any files"로 스크립트 전체가 죽어, 뉴스/법안까지 커밋되지 않은 적이 있었다.
          # GitHub는 파일 하나가 100MB를 넘으면 push를 거부한다(그러면 이번 실행 결과가 통째로
          # 사라진다). 한도에 닿기 전에 미리 알리고, 95MB를 넘으면 원인이 보이도록 먼저 실패시킨다.
          big=$(find . -path ./.git -prune -o -type f -size +80M -print)
          if [ -n "$big" ]; then
            echo "::warning::80MB를 넘은 파일이 있습니다(GitHub 한도 100MB) - 보관 기간/수집 범위를 줄이세요: $big"
          fi
          huge=$(find . -path ./.git -prune -o -type f -size +95M -print)
          if [ -n "$huge" ]; then
            echo "::error::95MB를 넘은 파일이 있어 push가 거부될 수 있습니다: $huge"
            exit 1
          fi
          for f in news_list.csv bill_list.csv bill_status_log.csv member_list.csv member_news.csv cluster_warnings.csv gemini_usage.csv rejected_news.csv decision_list.csv law_penalty_list.csv subordinate_law_list.csv contract_law_corpus.csv docs/index.html docs/news.json docs/bills.json docs/members.json docs/warnings.json docs/decisions.json docs/law_penalties.json docs/subordinate_laws.json subordinate_law_diffs.json docs/subordinate_law_diffs.json legislative_notice_list.csv docs/legislative_notices.json docs/contract_law_corpus.json; do
            [ -f "$f" ] && git add "$f"
          done
          # 보관 기간(90일)이 지나 news_list.csv에서 빠진 기사는 docs/archive/YYYY-MM.json에만 남는다
          # ("옛 기사 검색"이 읽는 파일). 커밋 대상에 없으면 러너와 함께 사라지므로 같이 add 한다.
          if [ -d docs/archive ]; then git add docs/archive; fi
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "Update news data"
            # 이 스크립트가 실행되는 동안 다른 커밋(예: 코드 수정)이 먼저 푸시되어
            # main이 앞서 있으면 그냥 push하면 거부되므로, 먼저 최신 내용을 받아온 뒤 푸시한다.
            # news_list.csv/bill_list.csv/docs/*는 매번 스크립트가 통째로 새로
            # 만들어내는 자동 생성 파일이라, 충돌이 나면 "지금 막 새로 만든 것"이 항상
            # 정답이다 - rebase 대신 merge를 쓰고, 이 파일들 충돌은 우리 쪽(ours)으로 해결한다.
            git fetch origin main
            if ! git merge origin/main --no-edit; then
              conflicted=$(git diff --name-only --diff-filter=U)
              echo "::warning::자동 생성 파일에서 병합 충돌 발생 - 이번 실행 결과로 덮어써서 해결함: $conflicted"
              # 목록을 다시 적지 않고 실제로 충돌난 파일만 처리한다. 파일 목록을 손으로
              # 적어두면(docs/news.json 처럼) 아직 원격에 없는 파일에 checkout --ours 가
              # 걸려 죽는다.
              git checkout --ours -- $conflicted
              git add $conflicted
              git commit --no-edit
            fi
            if ! git push; then
              echo "::error::git push 실패 - 이번 실행 결과가 원격에 반영되지 않았습니다. 로그를 확인하세요."
              exit 1
            fi
          fi
