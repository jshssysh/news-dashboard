# 원안->대안 매핑 필드(BILL_ID_REF)가 실제로 채워지는지 확인하기 위한
# 일회성 진단 워크플로우. 자동 트리거 없음(workflow_dispatch만) - 확인 끝나면 삭제할 것.
# TVBPMBILL11(법률안 심사 및 처리 - 의안검색)은 AGE가 필수 파라미터라 그것부터
# 채워서 재시도 - 아까 "위원회안,대안"(nxtkyptyaolzcbfwl) 호출이 Bad Request였던
# 것도 활용신청 문제가 아니라 이 필수 파라미터 누락 때문일 가능성이 있음.
name: test-alt-bill-api

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 키 자체가 넘어오는지부터 확인 (길이만 - 값은 안 찍음)
        env:
          KEY: ${{ secrets.ASSEMBLY_API_KEY }}
        run: |
          echo "KEY length: ${#KEY}"
      - name: 이미 매일 정상 작동 중인 계류의안 API로 대조 확인
        continue-on-error: true
        env:
          KEY: ${{ secrets.ASSEMBLY_API_KEY }}
        run: |
          curl -s --max-time 20 "https://open.assembly.go.kr/portal/openapi/nwbqublzajtcqpdae?KEY=$KEY&Type=json&pIndex=1&pSize=1" -o known.json
          cat known.json || true
      - name: 대안반영폐기 실제 사례로 의안검색 API 호출 (국민연금법, BILL_ID_REF 확인)
        continue-on-error: true
        env:
          KEY: ${{ secrets.ASSEMBLY_API_KEY }}
        run: |
          curl -s --max-time 20 "https://open.assembly.go.kr/portal/openapi/TVBPMBILL11?KEY=$KEY&Type=json&pIndex=1&pSize=5&AGE=22&BILL_ID=PRC_P2O6M0M9I0I7H1I6G2G2F4N5N8L6M5" -o response1.json
          echo "--- response1 (BILL_ID 지정 조회) ---"
          cat response1.json || true
          echo ""
          echo "--- response2 (AGE만 넣고 위원회안,대안 API 재시도) ---"
          curl -s --max-time 20 "https://open.assembly.go.kr/portal/openapi/nxtkyptyaolzcbfwl?KEY=$KEY&Type=json&pIndex=1&pSize=5&AGE=22" -o response2.json
          cat response2.json || true
      - name: Python(requests)으로 동일 요청 재현 - curl과 비교
        continue-on-error: true
        env:
          KEY: ${{ secrets.ASSEMBLY_API_KEY }}
        run: |
          pip install requests --quiet
          python3 - <<'PYEOF'
          import os, requests
          key = os.environ["KEY"]
          base = "https://open.assembly.go.kr/portal/openapi"

          def call(service, extra=None):
              params = {"KEY": key, "Type": "json", "pIndex": 1, "pSize": 1}
              if extra:
                  params.update(extra)
              try:
                  r = requests.get(f"{base}/{service}", params=params, timeout=15)
                  print(f"--- {service} status={r.status_code} ---")
                  print(r.text[:800])
              except Exception as e:
                  print(f"--- {service} exception: {e} ---")
              print()

          call("nwbqublzajtcqpdae")  # 기존에 매일 정상 작동 중인 계류의안
          call("nxtkyptyaolzcbfwl")  # 위원회안,대안 (AGE 빼고 - 필수 아님)
          call("TVBPMBILL11", {"AGE": "22", "BILL_ID": "PRC_P2O6M0M9I0I7H1I6G2G2F4N5N8L6M5"})
          PYEOF
      - name: 응답을 아티팩트로도 저장
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alt-bill-api-response
          if-no-files-found: warn
          path: |
            known.json
            response1.json
            response2.json
