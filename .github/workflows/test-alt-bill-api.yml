# 직접 연결 필드가 없다는 걸 확인했으니(이전 조사), "소관위 + 처리일자"로
# 원안<->대안을 간접 매칭할 수 있는지 확인하는 일회성 진단. 확인 끝나면 삭제.
name: test-alt-bill-api

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 보건복지위원회 + 2026-09-17 처리 대안 찾기
        env:
          KEY: ${{ secrets.ASSEMBLY_API_KEY }}
        run: |
          pip install requests --quiet
          python3 - <<'PYEOF'
          import os, json, requests

          key = os.environ["KEY"]
          base = "https://open.assembly.go.kr/portal/openapi"

          params = {
              "KEY": key, "Type": "json", "pIndex": 1, "pSize": 100,
              "AGE": "22", "CURR_COMMITTEE": "보건복지위원회",
          }
          r = requests.get(f"{base}/nxtkyptyaolzcbfwl", params=params, timeout=15)
          print(f"status={r.status_code}")
          data = r.json()
          rows = data.get("nxtkyptyaolzcbfwl", [{}, {}])[1].get("row", [])
          print(f"보건복지위원회 위원회안/대안 건수: {len(rows)}")

          target_date = "2026-09-17"
          hits = [row for row in rows if target_date in json.dumps(row, ensure_ascii=False)]
          print(f"'{target_date}'가 어딘가 들어간 행: {len(hits)}건")
          for row in hits:
              print(json.dumps(row, ensure_ascii=False))
          print()
          print("--- 전체 행 (날짜 매칭 없을 경우 육안 확인용, 최근 10건) ---")
          for row in rows[:10]:
              print(json.dumps(row, ensure_ascii=False))
          PYEOF
