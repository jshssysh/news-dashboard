name: "[점검] 법제처 API 응답 확인"

# 법제처 Open API(행정규칙·별표서식·위임 행정규칙) 응답 구조 확인용 (probe_law_api.py 참고).
# 회사 PC에는 OC 키가 없어 응답을 볼 수 없고 Actions 로그 화면도 막혀 있으므로, 출력을
# eval/results/probe_law_api.txt로 커밋해 저장소 파일로 읽는다(그 파일 하나만 커밋한다).
on:
  workflow_dispatch:
    inputs:
      law_name:
        description: '위임 행정규칙·별표서식을 볼 법령 정식 이름(비워두면 하도급거래 공정화에 관한 법률)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필수 라이브러리 설치
        run: pip install requests

      - name: 법제처 API 응답 확인
        env:
          LAW_GO_KR_OC: ${{ secrets.LAW_GO_KR_OC }}
          LAW_NAME: ${{ github.event.inputs.law_name }}
          PYTHONIOENCODING: utf-8
        run: |
          mkdir -p eval/results
          python probe_law_api.py "$LAW_NAME" 2>&1 | tee eval/results/probe_law_api.txt

      - name: 확인 결과 커밋
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add eval/results/probe_law_api.txt
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "법제처 API 응답 확인 결과"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 10
          done
          exit 1
