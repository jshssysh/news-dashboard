name: "[점검] 법제처 API 응답 확인"

# 법제처 Open API(행정규칙·별표서식·위임 행정규칙) 응답 구조 확인용 (probe_law_api.py 참고).
# 회사 PC에는 OC 키가 없어 응답을 볼 수 없으므로 Actions에서 수동으로 한 번 돌려
# 로그만 본다. 아무것도 저장·커밋하지 않는다.
on:
  workflow_dispatch:
    inputs:
      law_name:
        description: '위임 행정규칙·별표서식을 볼 법령 정식 이름(비워두면 하도급거래 공정화에 관한 법률)'
        required: false
        type: string
        default: ''

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필수 라이브러리 설치
        run: pip install requests

      - name: 법제처 API 응답 확인
        env:
          LAW_GO_KR_OC: ${{ secrets.LAW_GO_KR_OC }}
          LAW_NAME: ${{ github.event.inputs.law_name }}
        run: python probe_law_api.py "$LAW_NAME"
