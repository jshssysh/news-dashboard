<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Brief</title>
<style>
:root {
  --app-primary: #ff4b4b; --app-secondary-bg: #f0f2f6; --app-text: #31333f; --app-bg: #ffffff;
  --app-border: rgba(49,51,63,0.14); --app-border-strong: rgba(49,51,63,0.22);
  --app-shadow: 0 1px 2px rgba(15,15,20,0.04), 0 1px 12px rgba(15,15,20,0.045);
  --app-shadow-hover: 0 4px 16px rgba(15,15,20,0.09);
  --ease: cubic-bezier(.2,.7,.3,1);
}
@media (prefers-color-scheme: dark) {
  :root {
    --app-primary: #ff6b6b; --app-secondary-bg: #262730; --app-text: #fafafa; --app-bg: #0e1117;
    --app-border: rgba(255,255,255,0.10); --app-border-strong: rgba(255,255,255,0.18);
    --app-shadow: 0 1px 2px rgba(0,0,0,0.25), 0 1px 14px rgba(0,0,0,0.28);
    --app-shadow-hover: 0 6px 20px rgba(0,0,0,0.35);
  }
}
* { box-sizing: border-box; }
body {
  background: var(--app-bg); color: var(--app-text); margin: 0;
  font-family: "Segoe UI","Malgun Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
a { color: inherit; }
button, select, input { font-family: inherit; }
button { cursor: pointer; background: var(--app-bg); color: var(--app-text); transition: background-color .15s var(--ease), border-color .15s var(--ease), box-shadow .15s var(--ease), transform .1s var(--ease); }
button:active { transform: translateY(1px); }
.block-container { max-width: 1100px; margin: 0 auto; padding: 28px 20px 64px; }

.app-header { display: flex; align-items: center; justify-content: center; padding: 4px 10px; border: 1px solid var(--app-border); border-radius: 10px; height: 100%; }
.app-title { font-size: 1.08em; font-weight: 800; letter-spacing: -0.3px; line-height: 1.18; }

.top-stat-row { display: flex; gap: 12px; align-items: stretch; margin-bottom: 16px; }
.tile-db { flex: 1.38 1 0; min-width: 0; }
.tile-collect { flex: 1.3 1 0; min-width: 0; }
.tile-law { flex: 1.92 1 0; min-width: 0; }

.db-tile { background: var(--app-secondary-bg); border: 1px solid var(--app-border); box-shadow: var(--app-shadow); border-radius: 10px; padding: 12px 16px; height: 100%; display: flex; gap: 6px; }
.db-left { flex: 0.8 1 0; display: flex; }
.db-right { flex: 2.2 1 0; display: flex; flex-direction: column; gap: 3px; justify-content: center; }
.db-tabs-row { display: flex; gap: 4px; }
.db-tabs-row button { flex: 1 1 0; min-width: 0; padding: 2px 6px; font-size: 0.7em; white-space: pre-line; line-height: 1.15; border: 1px solid var(--app-border); border-radius: 10px; min-height: 32px; }
.db-tabs-row button:hover:not(.active) { border-color: var(--app-border-strong); background: rgba(128,128,128,0.08); }
.db-tabs-row button.active { background: var(--app-primary); color: #fff; border-color: var(--app-primary); box-shadow: 0 2px 8px rgba(255,75,75,0.35); }
.db-date-row { display: flex; gap: 4px; align-items: center; }
.db-date-row button { flex: 0 0 auto; padding: 1px 10px; font-size: 0.72em; border: 1px solid var(--app-border); border-radius: 10px; }
.db-date-row button:hover { border-color: var(--app-border-strong); background: rgba(128,128,128,0.08); }
.date-pill { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; border: 1px solid var(--app-border); border-radius: 10px; padding: 1px 10px; font-weight: 600; font-size: 0.72em; white-space: nowrap; font-variant-numeric: tabular-nums; }

.stat-card { background: var(--app-secondary-bg); border: 1px solid var(--app-border); box-shadow: var(--app-shadow); border-radius: 10px; padding: 14px 16px; height: 100%; box-sizing: border-box; }
.tile-law .stat-card { padding-right: 8px; }
.law-substats-block { display: flex; flex-direction: column; gap: 2px; font-size: 0.72em; opacity: 0.62; align-self: center; }
.collect-substats-block { display: flex; flex-direction: column; gap: 2px; align-self: center; }
.collect-substats-block .sub-inline { white-space: nowrap; }
.stat-card .label { font-size: 0.76em; font-weight: 600; opacity: 0.62; margin-bottom: 6px; letter-spacing: 0.2px; }
.stat-card .value-line { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; row-gap: 2px; }
.stat-card .value { font-size: 1.85em; font-weight: 800; letter-spacing: -0.4px; font-variant-numeric: tabular-nums; }
.stat-card .sub-inline { font-size: 0.72em; opacity: 0.58; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat-card .sm-fail { font-size: 0.72em; color: #9c4dcc; font-weight: 700; }
@media (prefers-color-scheme: dark) {
  .stat-card .sm-fail { color: #c792ea; }
}

hr.thin { border: none; border-top: 1px solid var(--app-border); margin: 8px 0; }

.badge-positive, .badge-neutral, .badge-negative, .badge-fail, .badge-skipped, .chip-category, .chip-tag-warn, .chip-alert {
  display: inline-block; padding: 3px 9px; border-radius: 5px; font-weight: 700; font-size: 0.8em; letter-spacing: 0.1px; margin-right: 6px; text-decoration: none;
}
a.badge-skipped:hover { text-decoration: underline; }
.badge-positive { background-color: #e8f5e9; color: #2e7d32; }
.badge-neutral { background-color: #fff3cd; color: #8a6100; }
.badge-negative { background-color: #fdecea; color: #c62828; }
.badge-fail { background-color: #f3e5f5; color: #7b1fa2; }
.badge-skipped { background-color: rgba(128,128,128,0.18); color: var(--app-text); opacity: 0.7; }
.chip-category { background: var(--app-secondary-bg); border: 1px solid var(--app-border); }
.chip-tag-warn { background-color: #fdecea; color: #c62828; }
.chip-alert { background-color: #c62828; color: #fff; font-size: 0.76em; }
.card-meta-inline { font-size: 0.78em; opacity: 0.56; margin-left: 8px; }
.bill-title-line { margin: 1px 0 5px; line-height: 1.5; }
.card-head.bill-title-line { flex-wrap: wrap; }
.bill-title-line .article-title { white-space: normal; overflow: visible; text-overflow: unset; flex: initial; margin-right: 4px; }
.bill-title-line .meta-dim { opacity: 0.56; font-size: 0.92em; }
.bill-title-line .proposer-detail { font-weight: 700; opacity: 0.88; font-size: 0.92em; }
.bill-stepper { display: flex; flex-wrap: wrap; align-items: center; gap: 3px; margin-bottom: 6px; font-size: 0.76em; }
.bill-step { padding: 3px 8px; border-radius: 6px; border: 1px solid var(--app-border); background: var(--app-secondary-bg); white-space: nowrap; font-weight: 600; }
.bill-step.step-active { background: var(--app-primary); color: #fff; border-color: var(--app-primary); font-weight: 700; }
.bill-step.step-done { opacity: 0.6; }
.bill-step.step-future { opacity: 0.35; }
.bill-step .step-date { margin-left: 4px; font-weight: 400; opacity: 0.85; font-size: 0.92em; }
.bill-step-arrow { opacity: 0.35; font-size: 0.85em; padding: 0 1px; }
.reason-chip { display: inline-block; background: var(--app-secondary-bg); padding: 2px 8px; border-radius: 5px; font-size: 0.8em; font-weight: 600; margin-right: 4px; border: 1px solid var(--app-border); }
.reason-box { border: 1px solid var(--app-border); border-radius: 8px; padding: 4px 9px; display: flex; align-items: center; flex-wrap: wrap; gap: 5px; line-height: 1.3; }
/* "선별 근거"가 스타일 없는 맨 텍스트라 옆 칩(0.8em)보다 커서 혼자 튀어 보였다.
   다른 라벨(.chip-row-label 등)과 같은 결로 작고 흐리게 맞춘다. */
.reason-label { font-size: 0.74em; font-weight: 700; opacity: 0.5; letter-spacing: -0.1px; margin-right: 1px; }
/* 유사기사 토글은 두 벌을 두고 화면 크기에 따라 하나만 보여준다.
   데스크톱은 기존대로 카드 하단(.toggle-btn-bottom), 모바일은 제목 줄 옆
   (.toggle-btn-inline)에 짧게. 둘 다 같은 data-key라 어느 쪽을 눌러도 동작한다. */
.toggle-btn-inline { display: none; }
.toggle-btn { font-size: 0.82em; font-weight: 700; padding: 4px 11px; border: 1px solid var(--app-border); border-radius: 7px; background: var(--app-secondary-bg); white-space: nowrap; }
.toggle-btn:hover { border-color: var(--app-border-strong); box-shadow: var(--app-shadow); }

.star-btn { flex-shrink: 0; border: none; background: none; font-size: 1.2em; line-height: 1; padding: 0 4px 0 0; color: #d9a441; }
.star-btn.starred { color: #f0b429; }
.star-filter-btn { flex-shrink: 0; padding: 7px 12px; border: 1px solid var(--app-border); border-radius: 7px; background: var(--app-secondary-bg); font-size: 0.85em; white-space: nowrap; }
.star-filter-btn.active { background: var(--app-primary); color: #fff; border-color: var(--app-primary); }
.bill-card .card-head { margin-bottom: 4px; }

.summary-box-blue { background-color: #eaf1fc; padding: 9px 12px; border-radius: 8px; margin-bottom: 0; font-size: 0.93em; color: #1a4d8f; display: block; text-decoration: none; line-height: 1.5; transition: background-color .15s var(--ease); }
.summary-box-blue:hover { background-color: #dbe8fa; }
@media (prefers-color-scheme: dark) {
  .summary-box-blue { background-color: rgba(255,255,255,0.05); color: #a9c6f5; }
  .summary-box-blue:hover { background-color: rgba(255,255,255,0.09); }
}
.signal-box { background-color: #12203a; border: 1px solid #1b2e50; border-radius: 12px; padding: 18px 20px; margin-bottom: 18px; box-shadow: var(--app-shadow); }
.signal-tag { display: inline-block; background-color: #24406e; color: #8ab4f8; font-size: 0.74em; font-weight: 700; letter-spacing: 0.3px; padding: 3px 9px; border-radius: 5px; }
.signal-box-head { display: flex; align-items: center; justify-content: space-between; }
.signal-toggle-btn { background: none; border: none; color: #8ab4f8; opacity: 0.7; font-size: 0.8em; padding: 0; transition: transform .15s var(--ease); }
.signal-box.collapsed #signalItems { display: none; }
.signal-box.collapsed .signal-toggle-btn { transform: rotate(-90deg); }
.signal-item { margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.12); }
.signal-item:first-of-type { margin-top: 12px; padding-top: 0; border-top: none; }
.signal-num { display: inline-block; background-color: #8ab4f8; color: #0d1e36; font-weight: 800; width: 19px; height: 19px; border-radius: 50%; text-align: center; font-size: 0.74em; line-height: 19px; margin-right: 4px; flex-shrink: 0; }
.signal-item-head { color: #fff; font-size: 0.95em; display: flex; align-items: center; flex-wrap: wrap; gap: 5px; line-height: 1.4; }
.signal-item-body { color: #b9c6dc; font-size: 0.85em; margin-top: 5px; line-height: 1.5; }
.chip-category-dark { background-color: #24406e; color: #8ab4f8; font-weight: 600; padding: 2px 7px; border-radius: 5px; font-size: 0.78em; margin: 0 2px; }
.reason-chip-dark { display: inline-block; background-color: rgba(138,180,248,0.12); color: #8ab4f8; padding: 2px 8px; border-radius: 5px; font-size: 0.74em; font-weight: 600; margin-right: 4px; }

.news-filter-row { display: flex; align-items: center; gap: 10px; flex-wrap: nowrap; margin-bottom: 12px; }
.news-filter-row h5 { margin: 0; width: 230px; flex: 0 0 auto; font-size: 1.02em; font-weight: 700; letter-spacing: -0.1px; white-space: nowrap; }
/* 셀렉트 묶음은 데스크톱에선 없는 셈 치고 부모 flex에 그대로 참여시킨다(기존 한 줄 배치 유지).
   모바일에서만 실제 flex 컨테이너가 되어 셀렉트 3개가 한 줄로 묶인다. */
.filter-selects { display: contents; }
/* 접기 UI는 모바일 전용 - 데스크톱에서는 캐럿/현재선택/접기줄을 모두 숨긴다 */
.stat-toggle-row { display: none; align-items: center; justify-content: space-between; gap: 8px; width: 100%;
  padding: 8px 12px; border: 1px solid var(--app-border); border-radius: 10px;
  background: var(--app-secondary-bg); font-size: 0.82em; font-weight: 700; color: var(--app-text); }
.news-filter-row h5 .toggle-caret,
.news-filter-row h5 .current-tag { display: none; }
@media (max-width: 800px) {
  .news-filter-row h5 .toggle-caret { display: inline; opacity: 0.5; font-size: 0.7em; transition: transform .15s var(--ease); }
  .news-filter-row h5 .current-tag { display: inline; }
}
.era-tag { font-size: 0.68em; font-weight: 600; opacity: 0.55; margin-left: 4px; }
.bill-filter-sticky { position: sticky; top: 0; z-index: 3; background: var(--app-bg); padding-top: 2px; }
.news-filter-row select { width: 100px; flex: 0 0 auto; background: var(--app-secondary-bg); color: var(--app-text); border: 1px solid var(--app-border); border-radius: 7px; padding: 7px 6px; font-size: 0.85em; transition: border-color .15s var(--ease); }
.news-filter-row select.sel-sentiment { width: 110px; }
.news-filter-row select:hover, .news-filter-row input[type=text]:hover { border-color: var(--app-border-strong); }
.news-filter-row select:focus, .news-filter-row input[type=text]:focus { outline: none; border-color: var(--app-primary); }
.news-filter-row input[type=text] { flex: 1 1 auto; min-width: 0; background: var(--app-secondary-bg); color: var(--app-text); border: 1px solid var(--app-border); border-radius: 7px; padding: 7px 12px; font-size: 0.85em; transition: border-color .15s var(--ease); }

.filter-section { border: 1px solid var(--app-border); border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; }
.filter-section-header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.filter-section-toggle {
  display: flex; align-items: center; gap: 6px;
  border: none; background: none; padding: 0; color: var(--app-text);
  font-size: 1.05em; font-weight: 800; letter-spacing: -0.1px; text-align: left;
}
.filter-section-toggle:hover { opacity: 0.75; }
.filter-section-toggle .toggle-caret { opacity: 0.5; font-size: 0.72em; transition: transform .15s var(--ease); }
.filter-section.collapsed .filter-section-header { margin-bottom: 0; }
.filter-section.collapsed .filter-section-toggle .toggle-caret { transform: rotate(-90deg); }
.filter-section.collapsed .filter-section-body { display: none; }
.filter-section .filter-section-body { margin-bottom: 0; }
.committee-all-btn { padding: 5px 10px; font-size: 0.7em; }
.current-tag { font-size: 0.82em; font-weight: 700; color: var(--app-primary); }
#billCommitteeChipRow button { padding: 4px 9px; font-size: 0.78em; }
#catChipRow { flex-wrap: wrap; overflow-x: visible; row-gap: 8px; padding-bottom: 0; }
#catChipRow button { padding: 5px 10px; font-size: 0.8em; }

.bill-result-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.bill-result-row .result-caption { margin-bottom: 0; flex: 1 1 auto; min-width: 0; }

.stage-flow-compact { display: flex; flex-wrap: wrap; align-items: center; gap: 3px; }
/* 처리상태 줄은 제목 없이 "전체 ▶ 입안 ▶ 상임위 ▶ 법사위 ▶ 본회의" 한 줄이다 */
.stage-flow-header { flex-wrap: nowrap; gap: 4px; }
.stage-flow-header .committee-all-btn { flex-shrink: 0; }
.flow-cnt { opacity: 0.65; font-weight: 600; }
.flow-plain.active .flow-cnt { opacity: 0.9; }
.flow-plain {
  flex-shrink: 0; white-space: nowrap; padding: 5px 10px; border-radius: 8px;
  border: 1px solid var(--app-border); background: var(--app-secondary-bg); font-weight: 700; font-size: 0.78em;
}
.flow-plain:hover:not(.active) { border-color: var(--app-border-strong); background: rgba(128,128,128,0.1); }
.flow-plain.active { background: var(--app-primary); color: #fff; border-color: var(--app-primary); box-shadow: 0 2px 8px rgba(255,75,75,0.32); }
.flow-result-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px 6px; margin-top: 10px; }
.flow-result-grid button {
  border: 1px solid var(--app-border); background: var(--app-bg); border-radius: 6px; font-size: 0.78em;
  font-weight: 600; padding: 4px 8px; text-align: left; white-space: nowrap;
}
.flow-result-grid button:hover:not(.active) { border-color: var(--app-border-strong); background: rgba(128,128,128,0.1); }
.flow-result-grid button.active { background: var(--app-primary); color: #fff; border-color: var(--app-primary); }
.cat-chip-row {
  display: flex; flex-wrap: nowrap; gap: 8px; margin-bottom: 12px;
  overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: thin; padding-bottom: 6px;
}
.cat-chip-row::-webkit-scrollbar { height: 5px; }
.cat-chip-row::-webkit-scrollbar-thumb { background: var(--app-border-strong); border-radius: 4px; }
.cat-chip-row::-webkit-scrollbar-track { background: transparent; }
.cat-chip-row button { flex-shrink: 0; border-radius: 20px; white-space: nowrap; padding: 6px 13px; border: 1px solid var(--app-border); background: var(--app-secondary-bg); font-size: 0.84em; font-weight: 600; }
.cat-chip-row button:hover:not(.active) { border-color: var(--app-border-strong); background: rgba(128,128,128,0.1); }
.cat-chip-row button.active { background: var(--app-primary); color: #fff; border-color: var(--app-primary); box-shadow: 0 2px 8px rgba(255,75,75,0.32); }
#billCommitteeChipRow { flex-wrap: wrap; overflow-x: visible; row-gap: 8px; padding-bottom: 0; }

.layout { display: flex; gap: 28px; align-items: flex-start; }
.main-col { flex: 2.85 1 0; min-width: 0; }
.side-col {
  flex: 1 1 0; min-width: 220px;
  /* 위쪽 필터 블록도 sticky라, 그 높이만큼 내려서 붙어야 가려지지 않는다.
     --filter-h는 필터 블록 실제 높이로 JS가 채운다(접기/줄바꿈에 따라 변함). */
  position: sticky; top: calc(var(--filter-h, 0px) + 20px); align-self: flex-start;
  max-height: calc(100vh - var(--filter-h, 0px) - 40px); overflow-y: auto;
  scrollbar-width: thin;
}
.side-col::-webkit-scrollbar { width: 6px; }
.side-col::-webkit-scrollbar-thumb { background: var(--app-border-strong); border-radius: 4px; }
.side-col::-webkit-scrollbar-track { background: transparent; }

.result-caption { font-size: 0.8em; opacity: 0.6; margin-bottom: 12px; }
.sidebar-panel { background: var(--app-secondary-bg); border: 1px solid var(--app-border); box-shadow: var(--app-shadow); border-radius: 10px; padding: 16px 14px; margin-bottom: 16px; }
.sidebar-panel .panel-title { font-weight: 700; margin-bottom: 12px; font-size: 0.95em; letter-spacing: -0.1px; }
/* 접기 표시는 모바일 전용 - 데스크톱에선 그냥 제목이다(아래 미디어쿼리에서 되살림) */
.sidebar-panel .panel-title .toggle-caret,
.sidebar-panel .panel-title .current-tag { display: none; }
.kw-row { margin-bottom: 18px; }
.kw-row:last-child { margin-bottom: 0; }
.kw-row-total .kw-label { font-size: 0.9em; }
.kw-row-total .sentiment-track { height: 10px; }
hr.kw-divider { border: none; border-top: 1px dashed var(--app-border); margin: 0 0 16px; }
.kw-row .kw-label { font-size: 0.84em; font-weight: 700; margin-bottom: 7px; display: flex; align-items: baseline; gap: 4px; flex-wrap: wrap; }
.kw-label-clickable { cursor: pointer; border-radius: 6px; padding: 2px 4px; margin: -2px -4px; transition: background-color .15s var(--ease); }
.kw-label-clickable:hover { background-color: rgba(128,128,128,0.12); }
.kw-total { opacity: 0.6; font-weight: 500; }
.cnt-neg { color: #e05353; font-weight: 700; }
.cnt-neu { color: #d99a2b; font-weight: 700; }
.cnt-pos { color: #43a047; font-weight: 700; }
.cnt-fail { color: #9c4dcc; font-weight: 700; opacity: 0.85; }
.sentiment-track { display: flex; width: 100%; height: 8px; border-radius: 8px; overflow: visible; background-color: rgba(128,128,128,0.18); }
.sentiment-seg {
    display: flex; align-items: center; justify-content: center; font-size: 0.76em; font-weight: 700; white-space: nowrap;
    -webkit-text-stroke: 3px var(--app-secondary-bg); paint-order: stroke fill; transition: width .3s var(--ease), filter .15s var(--ease);
    text-shadow: -1px -1px 0 var(--app-secondary-bg), 1px -1px 0 var(--app-secondary-bg), -1px 1px 0 var(--app-secondary-bg), 1px 1px 0 var(--app-secondary-bg), 0 0 4px var(--app-secondary-bg);
    cursor: pointer;
}
.sentiment-seg:hover { filter: brightness(1.15); }
.sentiment-seg:first-child { border-radius: 8px 0 0 8px; }
.sentiment-seg:last-child { border-radius: 0 8px 8px 0; }
.sentiment-neg { background-color: #e05353; color: #e05353; }
.sentiment-neu { background-color: #e0a940; color: #d99a2b; }
.sentiment-pos { background-color: #4caf82; color: #43a047; }

.pagination-row { display: flex; align-items: center; justify-content: center; gap: 4px; margin-bottom: 10px; flex-wrap: nowrap; }
.pg-top select { flex-shrink: 0; background: var(--app-secondary-bg); color: var(--app-text); border: 1px solid var(--app-border); border-radius: 6px; padding: 4px 3px; font-size: 0.78em; }
.pg-nav { display: flex; align-items: center; justify-content: center; gap: 3px; flex-wrap: nowrap; }
.pg-nav button { flex-shrink: 0; font-weight: 700; padding: 3px 3px; border: 1px solid var(--app-border); border-radius: 6px; background: var(--app-secondary-bg); min-width: 23px; font-size: 0.8em; }
.pg-nav button:hover:not(.active):not(:disabled) { border-color: var(--app-border-strong); background: rgba(128,128,128,0.1); }
.pg-nav button.active { background: var(--app-primary); color: #fff; border-color: var(--app-primary); }
.pg-nav button:disabled { opacity: 0.35; cursor: default; }

.article-card { border: 1px solid var(--app-border); border-radius: 10px; padding: 11px 14px; margin-bottom: 9px; box-shadow: var(--app-shadow); transition: box-shadow .15s var(--ease), border-color .15s var(--ease); }
.article-card:hover { box-shadow: var(--app-shadow-hover); border-color: var(--app-border-strong); }
.card-head { display: flex; align-items: baseline; flex-wrap: nowrap; gap: 6px; line-height: 1.45; margin-bottom: 6px; }
.card-tags { flex-shrink: 0; white-space: nowrap; }
.article-title { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-meta-group { flex-shrink: 0; white-space: nowrap; display: flex; align-items: baseline; gap: 6px; }
@media (max-width: 700px) {
  .card-head { flex-wrap: wrap; line-height: 1.7; }
  .article-title { white-space: normal; overflow: visible; text-overflow: unset; flex-basis: 100%; }
}
.article-title { font-weight: 700; text-decoration: none; line-height: 1.4; }
.article-title:hover { text-decoration: underline; }
.importance-tag { color: #b8860b; font-size: 0.84em; font-weight: 600; }
.related-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 7px; flex-wrap: wrap; }
.related-list { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--app-border); display: none; }
.related-list.open { display: block; }
.related-list div { margin-bottom: 5px; font-size: 0.88em; line-height: 1.5; }
.related-list a { color: #1565c0; text-decoration: none; }
.related-list a:hover { text-decoration: underline; }
@media (prefers-color-scheme: dark) { .related-list a { color: #7aa7e0; } }

.org-dept-title { font-size: 0.96em; font-weight: 700; margin: 18px 0 10px; letter-spacing: -0.1px; }
.org-person-row { margin-bottom: 7px; font-size: 0.9em; }
.info-box { background: var(--app-secondary-bg); border: 1px solid var(--app-border); border-radius: 8px; padding: 16px; font-size: 0.9em; line-height: 1.5; }
.generated-note { font-size: 0.72em; opacity: 0.45; text-align: center; margin-top: 36px; }
.view { display: none; }
.view.active { display: block; }

/* ── 모바일(<=800px) ── 기본 규칙보다 뒤에 있어야 덮어쓸 수 있어 스타일시트 끝에 둔다 ── */
@media (max-width: 800px) {
  .layout { flex-direction: column; }
  .side-col { position: static; max-height: none; overflow-y: visible; }
  .news-filter-row { flex-wrap: wrap; }
  .news-filter-row h5 { width: auto; }

  /* 상단 타일 3장을 좁은 화면에서 가로로 밀어 넣으면 숫자가 "697 / 건"으로 줄바꿈되고
     탭 버튼이 잘린다. Daily Brief(탭+날짜)를 한 줄 전체로 빼고 통계 두 장을 아래에 나란히. */
  .top-stat-row { flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .tile-db { flex: 1 1 100%; }
  .tile-collect, .tile-law { flex: 1 1 0; min-width: 0; }
  .db-left { display: none; }              /* 로고는 좁은 화면에서 공간만 차지 */
  .db-tile { padding: 10px 12px; }
  .db-tabs-row button { font-size: 0.78em; min-height: 34px; }
  .db-date-row button, .date-pill { font-size: 0.78em; padding: 3px 10px; }
  .stat-card { padding: 10px 12px; }
  .stat-card .value { font-size: 1.35em; white-space: nowrap; }
  .stat-card .label { margin-bottom: 4px; }

  /* 모바일은 세로가 짧아서 필터를 고정하면 기사 카드 첫 장을 통째로 덮어버린다
     (실제로 그렇게 보였음). 좁은 화면에서는 고정하지 않고 같이 스크롤되게 둔다. */
  .bill-filter-sticky { position: static; }

  /* 칩/카드 여백을 한 번 더 줄여 한 화면에 더 담는다 */
  #catChipRow button, #billCommitteeChipRow button { padding: 4px 9px; font-size: 0.76em; }
  .article-card { padding: 10px 12px; margin-bottom: 8px; }

  /* "9/10  08.27 00:02 · joongang.co.kr · 매체 25"는 nowrap +
     flex-shrink:0 이라 좁은 화면에서 줄지 않고 가로 스크롤을 만든다. 줄바꿈 허용. */
  .card-meta-group { flex-shrink: 1; min-width: 0; white-space: normal; }
  .card-meta-inline { margin-left: 0; }

  /* 한글은 기본적으로 아무 글자에서나 줄바꿈돼 "매체 26 / 개", "중요도 / 9/10"처럼
     단어가 쪼개진다. keep-all로 어절을 붙여두되, 긴 URL 등은 못 끊으면 넘치므로
     overflow-wrap으로 예외를 허용한다. */
  .article-title, .card-meta-group, .card-meta-inline, .summary-box-blue,
  .bill-title-line, .signal-item-head, .signal-item-body {
    word-break: keep-all; overflow-wrap: anywhere;
  }

  /* ── 통계 타일 접기 ── */
  .stat-toggle-row { display: flex; }        /* 데스크톱에선 none (아래 기본 규칙) */
  #topStatRow.stats-collapsed .tile-collect,
  #topStatRow.stats-collapsed .tile-law { display: none; }

  /* ── 카테고리별 주요뉴스 접기 + 세로 배치 ── */
  .news-filter-row { flex-direction: column; align-items: stretch; gap: 8px; }
  .news-filter-row h5 { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .filter-selects { display: flex; gap: 8px; }
  .filter-selects select { flex: 1 1 0; width: auto; min-width: 0; }
  .news-filter-row input[type=text] { width: 100%; }
  #newsFilterSticky.news-collapsed .filter-selects,
  #newsFilterSticky.news-collapsed #searchInput,
  #newsFilterSticky.news-collapsed #catChipRow { display: none; }
  #newsFilterSticky.news-collapsed .news-filter-row { gap: 0; margin-bottom: 8px; }
  #newsFilterSticky.news-collapsed .toggle-caret { transform: rotate(-90deg); }

  /* 접은 "오늘 주요 내용"은 태그 한 줄뿐인데 펼침용 여백(18px 20px)이 그대로 남아
     60px나 차지했다. 접었을 때만 여백을 줄인다(펼친 상태는 그대로). */
  .signal-box { padding: 14px 14px; margin-bottom: 12px; }
  .signal-box.collapsed { padding: 8px 12px; margin-bottom: 10px; }

  /* 유사기사 토글: 하단 긴 버튼 대신 제목 줄 옆에 짧게 */
  .toggle-btn-bottom { display: none; }
  .toggle-btn-inline { display: inline-block; flex-shrink: 0; padding: 2px 8px; font-size: 0.72em; }
  /* 버튼이 빠지면 선별근거 상자만 남으므로 폭을 다 쓰게 한다.
     근거가 셋(반복/키워드/제재·심결)까지 붙어도 두 줄로 넘어가지 않게
     줄바꿈을 막고 칩과 라벨을 한 단계씩 줄인다. */
  .related-row .reason-box { flex: 1 1 auto; flex-wrap: nowrap; gap: 4px; padding: 4px 7px; }
  .reason-box .reason-chip { font-size: 0.7em; padding: 2px 6px; margin-right: 0; white-space: nowrap; }
  .reason-box .reason-label { font-size: 0.66em; margin-right: 0; flex-shrink: 0; }

  /* ── 카테고리별 수집 현황을 "카테고리별 주요뉴스"와 결과줄 사이로 올린다 ──
     패널은 .layout 안(오른쪽 칼럼), 결과줄은 #newsFilterSticky 안이라 부모가 서로 달라
     order만으로는 순서를 바꿀 수 없다. 두 래퍼를 display:contents로 녹여서 안의
     요소들이 모두 #view-news의 flex 아이템이 되게 한 뒤 순서를 다시 잡는다.
     (모바일에선 두 래퍼 다 sticky가 꺼져 있어 녹여도 잃는 게 없다) */
  /* .active 를 꼭 같이 걸어야 한다. #view-news 만 쓰면 특이도가 .view 보다 높아서
     탭을 옮겨도 뉴스 화면이 계속 보이게 된다(display:none 이 덮어써짐). */
  #view-news.active { display: flex; flex-direction: column; }
  #newsFilterSticky, #view-news .layout { display: contents; }
  #view-news > hr.thin { order: 0; }
  #signalBox { order: 1; }
  #newsFilterSticky .news-filter-row { order: 2; }
  #catChipRow { order: 3; }
  .side-col { order: 4; }
  #newsResultRow { order: 5; }
  .main-col { order: 6; }
  /* 세로 배치에서 flex-basis:0(가로 비율용)이 남아 있으면 높이 계산이 꼬인다 */
  .main-col, .side-col { flex: 0 0 auto; width: 100%; min-width: 0; }
  /* 순서를 바꾸고 나면 원래 자리 기준으로 넣었던 구분선은 의미가 없다 */
  #newsFilterSticky hr.thin { display: none; }

  /* 패널 접기 (제목이 버튼 역할) */
  .sidebar-panel .panel-title { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .sidebar-panel .panel-title .toggle-caret { display: inline; opacity: 0.5; font-size: 0.7em; transition: transform .15s var(--ease); }
  .sidebar-panel .panel-title .current-tag { display: inline; }
  .sidebar-panel.side-collapsed #sidebarBars { display: none; }
  .sidebar-panel.side-collapsed .panel-title { margin-bottom: 0; }
  .sidebar-panel.side-collapsed { padding: 10px 14px; }
  .sidebar-panel.side-collapsed .toggle-caret { transform: rotate(-90deg); }

  /* 화면이 넓어 막대가 기니 건수/비율을 막대 안에 넣고 줄 간격을 줄인다 */
  .kw-row { margin-bottom: 14px; }
  .sentiment-track { height: 14px; }
  .kw-row-total .sentiment-track { height: 16px; }

  /* ── 처리상태 흐름을 좁은 화면에서도 한 줄로 ──
     칸 5개 + 화살표 4개를 폭 안에 넣으려면 단계별 건수까지는 못 들어간다.
     '전체'의 건수만 남기고 단계는 이름만 보인다(고른 단계의 건수는 바로 아래
     "전체 N건 중 ..." 줄에 어차피 다시 나온다). */
  .filter-section { padding: 10px 10px; }
  .stage-flow-compact { flex-wrap: nowrap; gap: 2px; }
  .stage-flow-header { gap: 2px; }
  .stage-flow-header .flow-plain { padding: 5px 5px; font-size: 0.68em; }
  .stage-flow-header .bill-step-arrow { font-size: 0.55em; padding: 0; }
  .stage-flow-compact .flow-cnt { display: none; }
}
</style>
</head>
<body>
<div class="block-container">

  <div class="top-stat-row" id="topStatRow">
    <div class="tile-db">
      <div class="db-tile">
        <div class="db-left"><div class="app-header"><span class="app-title">Daily<br>Brief</span></div></div>
        <div class="db-right">
          <div class="db-tabs-row" id="tabsRow"></div>
          <div class="db-date-row">
            <button id="datePrev">◀</button>
            <div class="date-pill" id="dateText"></div>
            <button id="dateNext">▶</button>
          </div>
        </div>
      </div>
    </div>
    <!-- 모바일에서만 보이는 접기 줄. 접으면 아래 두 타일이 숨고 요약만 한 줄로 남는다. -->
    <button class="stat-toggle-row" id="statToggleBtn">
      <span id="statSummaryText"></span><span class="toggle-caret">▼</span>
    </button>
    <div class="tile-collect"><div class="stat-card" id="statCollect"></div></div>
    <div class="tile-law"><div class="stat-card" id="statLaw"></div></div>
  </div>

  <div id="view-news" class="view">
    <hr class="thin">
    <!-- 오늘 주요 내용은 필터가 아니라 읽을거리라 스티키에서 제외한다.
         (스티키에 넣으면 블록이 450px까지 커져서 사이드바를 덮어버림) -->
    <div class="signal-box" id="signalBox">
      <div class="signal-box-head">
        <span class="signal-tag">오늘 주요 내용</span>
        <button class="signal-toggle-btn" id="signalToggleBtn">▼</button>
      </div>
      <div id="signalItems"></div>
    </div>

    <div class="bill-filter-sticky" id="newsFilterSticky">
      <div class="news-filter-row">
        <!-- 모바일에서 이 제목이 접기 버튼이 된다(데스크톱에서는 그냥 제목) -->
        <h5 id="newsFilterToggle">카테고리별 주요뉴스<span class="toggle-caret">▼</span><span class="current-tag" id="newsCurrentTag"></span></h5>
        <!-- 데스크톱에서는 display:contents 로 부모 flex에 그대로 참여해 기존 한 줄 배치를
             유지하고, 모바일에서만 셀렉트 3개가 한 줄로 묶인다. -->
        <div class="filter-selects">
          <select id="periodSelect">
            <option value="0">오늘만</option>
            <option value="6">최근 7일</option>
            <option value="29">최근 30일</option>
          </select>
          <select id="sortSelect">
            <option value="importance">중요도순</option>
            <option value="press">보도량순</option>
            <option value="latest">최신순</option>
          </select>
          <select id="sentimentSelect" class="sel-sentiment">
            <option value="">논조 전체</option>
            <option value="긍정">긍정</option>
            <option value="중립">중립</option>
            <option value="부정">부정</option>
            <option value="판단 실패">판단 실패</option>
          </select>
        </div>
        <input type="text" id="searchInput" placeholder="제목, 요약에서 검색">
      </div>

      <div class="cat-chip-row" id="catChipRow"></div>
      <hr class="thin">
      <div class="bill-result-row" id="newsResultRow">
        <div class="result-caption" id="resultCaption"></div>
        <div class="pg-top"><select id="pageSizeSel">
          <option value="5">5개</option><option value="10">10개</option><option value="20">20개</option><option value="50">50개</option>
        </select></div>
        <div class="pg-nav" id="pgNav"></div>
      </div>
      <hr class="thin">
    </div>

    <div class="layout">
      <div class="main-col">
        <div id="mainListArea"></div>
      </div>
      <div class="side-col">
        <div class="sidebar-panel" id="sidebarPanel">
          <!-- 모바일에서는 이 제목이 접기 버튼이 된다(데스크톱에서는 그냥 제목) -->
          <div class="panel-title" id="sidebarToggle">카테고리별 수집 현황<span class="toggle-caret">▼</span><span class="current-tag" id="sidebarCurrentTag"></span></div>
          <div id="sidebarBars"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="view-law" class="view">
    <hr class="thin">
    <div class="bill-filter-sticky">
      <div class="news-filter-row">
        <h5>국회 계류 법안 <span class="era-tag">제22대</span></h5>
        <button id="billStarredToggle" class="star-filter-btn">☆ 즐겨찾기만</button>
        <input type="text" id="billSearchInput" placeholder="법안명, 발의자에서 검색">
      </div>
      <div class="filter-section" id="committeeFilterSection">
        <div class="filter-section-header">
          <button class="filter-section-toggle" data-target="committeeFilterSection">소관위원회 <span class="toggle-caret">▼</span></button>
          <button id="billCommitteeAllBtn" class="flow-plain committee-all-btn"></button>
          <span class="current-tag" id="committeeCurrentTag"></span>
        </div>
        <div class="cat-chip-row filter-section-body" id="billCommitteeChipRow"></div>
      </div>
      <!-- 처리상태: 제목 없이 흐름 자체가 한 줄이다.
           같은 단계를 다시 누르면 전체로 돌아가면서 세부결과가 접힌다. -->
      <div class="filter-section" id="stageFilterSection">
        <div class="filter-section-header stage-flow-header">
          <button id="billStageAllBtn" class="flow-plain committee-all-btn"></button>
          <span class="bill-step-arrow">▶</span>
          <div class="stage-flow-compact" id="billStatusChipRow"></div>
        </div>
        <div class="filter-section-body" id="billStageGridArea"></div>
      </div>
      <hr class="thin">
      <div class="bill-result-row">
        <div class="result-caption" id="billResultCaption"></div>
        <div class="pg-top"><select id="billPageSizeSel">
          <option value="5">5개</option><option value="10">10개</option><option value="20">20개</option><option value="50">50개</option>
        </select></div>
        <div class="pg-nav" id="billPgNav"></div>
      </div>
      <hr class="thin">
    </div>
    <div id="billListArea"></div>
  </div>

  <div id="view-org" class="view">
    <hr class="thin">
    <div class="info-box">아직 준비중입니다.</div>
  </div>

  <div id="view-empty" class="view">
    <hr class="thin">
    <div class="info-box">해당 날짜에 수집된 기사 데이터가 없습니다.</div>
  </div>

  <div class="generated-note">생성 시각: __GENERATED_AT__ (GitHub Actions에서 자동 생성됨)</div>
</div>

<script>
// 데이터는 이 파일에 박혀 있지 않고 news.json / bills.json 에서 받아온다.
// (전부 넣었더니 16MB가 됐고, 그 크기에선 GitHub Pages가 gzip을 안 해준다)
// 그래서 처음엔 비어 있고, 아래 맨 끝 부트스트랩에서 채운다.
let NEWS_DATA = [];
let BILL_DATA = [];
let allDates = [];
const PERSONNEL_DATA = __PERSONNEL_DATA_JSON__;
// 상단 '입법 현황' 타일은 법안 목록을 받기 전에도 숫자가 떠야 해서 건수만 미리 받는다
const BILL_STATS = __BILL_STATS_JSON__;

const STARRED_BILLS_KEY = 'starredBills';
function getStarredBills() {
  try { return new Set(JSON.parse(localStorage.getItem(STARRED_BILLS_KEY) || '[]')); }
  catch(e) { return new Set(); }
}
function toggleStarredBill(id) {
  const s = getStarredBills();
  if (s.has(id)) s.delete(id); else s.add(id);
  try { localStorage.setItem(STARRED_BILLS_KEY, JSON.stringify(Array.from(s))); } catch(e) {}
  return s;
}

const NEWS_CATEGORY_ORDER = ["공정거래","내부거래","지배구조","상생","하도급","상법","시민단체","노동","ESG","기타"];
function newsCategoryRank(c) {
  const idx = NEWS_CATEGORY_ORDER.indexOf(c);
  return idx === -1 ? NEWS_CATEGORY_ORDER.length : idx;
}

const CRITICAL_KEYWORDS = ["과징금","시정명령","고발","동의의결","담합","사익편취","일감몰아주기","기술탈취"];
const FINE_AMOUNT_PATTERN = /과징금\s*([0-9][0-9,.]*)\s*(억|만)\s*원?/;

const ACTIVE_TAB_KEY = 'activeTab';
function getSavedTab() {
  try { return localStorage.getItem(ACTIVE_TAB_KEY) || '뉴스'; } catch(e) { return '뉴스'; }
}
function saveActiveTab(tab) {
  try { localStorage.setItem(ACTIVE_TAB_KEY, tab); } catch(e) {}
}

// 한 쪽에 몇 건씩 볼지는 사람마다 화면 크기가 달라 취향을 타므로, 고른 값을
// 브라우저에 기억시킨다(안 그러면 새로고침마다 10개로 되돌아감).
const PAGE_SIZE_KEYS = { news: 'newsPageSize', bill: 'billPageSize' };
// 좁은 화면에서는 한 화면에 한두 건씩 보고 넘기는 편이 편해서 1~5를 넣고 50은 뺀다.
const IS_NARROW = (() => { try { return window.matchMedia('(max-width: 800px)').matches; } catch(e) { return false; } })();
const ALLOWED_PAGE_SIZES = IS_NARROW ? [1, 2, 3, 4, 5, 10, 20] : [5, 10, 20, 50];
function getSavedPageSize(kind) {
  try {
    const v = parseInt(localStorage.getItem(PAGE_SIZE_KEYS[kind]), 10);
    return ALLOWED_PAGE_SIZES.includes(v) ? v : 10;
  } catch(e) { return 10; }
}
// 선택지가 화면 폭에 따라 달라지므로 <option>은 HTML이 아니라 여기서 채운다.
function fillPageSizeOptions() {
  ['pageSizeSel', 'billPageSizeSel'].forEach(id => {
    const sel = document.getElementById(id);
    if (sel) sel.innerHTML = ALLOWED_PAGE_SIZES.map(n => `<option value="${n}">${n}개</option>`).join('');
  });
}
function savePageSize(kind, size) {
  try { localStorage.setItem(PAGE_SIZE_KEYS[kind], String(size)); } catch(e) {}
}

  selectedCategory: '전체',
  period: 0,
  sort: 'importance',
  sentiment: '',
  search: '',
  pageSize: getSavedPageSize('news'),
  page: 1,
  openIssues: {},
  billCommittee: '전체',
  billStage: '전체',
  billResult: '전체',
  billStarredOnly: false,
  billSearch: '',
  billPage: 1,
  billPageSize: getSavedPageSize('bill'),
};

function extractDomain(url) { try { return new URL(url).host.replace(/^www\./, ""); } catch(e) { return ""; } }

// 네이버 뉴스는 통신사/포털 제휴 매체가 뒤섞여 있어서, 그룹의 대표기사를 고를 때
// 아래 주요 언론사 도메인 기사 중 중요도가 가장 높은 걸 우선한다(없으면 원래대로
// 전체 중 최고 중요도로 폴백).
const MAJOR_PRESS_DOMAINS = [
  "yna.co.kr", "chosun.com", "joongang.co.kr", "joins.com", "donga.com", "hani.co.kr", "khan.co.kr",
  "hankookilbo.com", "seoul.co.kr", "kmib.co.kr", "munhwa.com", "mk.co.kr", "hankyung.com",
  "sedaily.com", "heraldcorp.com", "fnnews.com", "edaily.co.kr", "mt.co.kr", "newsis.com", "news1.kr",
  "kbs.co.kr", "imbc.com", "mbc.co.kr", "sbs.co.kr", "ytn.co.kr", "jtbc.co.kr",
];
function isMajorPress(link) {
  const domain = extractDomain(link);
  if (!domain) return false;
  return MAJOR_PRESS_DOMAINS.some(d => domain === d || domain.endsWith("." + d));
}
function extractFineAmount(text) { const m = FINE_AMOUNT_PATTERN.exec(text || ""); return m ? ("과징금 " + m[1] + m[2] + "원") : null; }
function keywordRepeatInfo(rows) {
  let bestKw = null, bestCount = 0;
  CRITICAL_KEYWORDS.forEach(kw => {
    const c = rows.filter(r => r.title.indexOf(kw) !== -1).length;
    if (c > bestCount) { bestKw = kw; bestCount = c; }
  });
  return [bestKw, bestCount];
}
// 카드가 좁아 두 줄로 넘어가지 않도록 문구를 최소로 줄인다.
// ("반복 보도 26건" -> "반복 26", "'과징금' 9회 반복" -> "과징금 9회")
const REASON_SANCTION = "제재·심결";
function selectionReasons(g) {
  const reasons = [];
  if (g.pressCount >= 5) reasons.push("반복 " + g.pressCount);
  if (g.kwRepeat[0] && g.kwRepeat[1] >= 2) reasons.push(g.kwRepeat[0] + " " + g.kwRepeat[1] + "회");
  if (g.category === "공정거래") reasons.push(REASON_SANCTION);
  return reasons;
}
function badgeClass(sentiment) { return {'긍정':'badge-positive','부정':'badge-negative','판단 실패':'badge-fail'}[sentiment] || 'badge-neutral'; }
function fmtDt(ts) {
  if (!ts) return "";
  const d = new Date(ts);
  const mm = String(d.getMonth()+1).padStart(2,"0"), dd = String(d.getDate()).padStart(2,"0");
  const hh = String(d.getHours()).padStart(2,"0"), mi = String(d.getMinutes()).padStart(2,"0");
  return mm + "." + dd + " " + hh + ":" + mi;
}

function buildIssueGroups(rows) {
  const byIssue = {};
  // 대표이슈가 비어 있으면(분석 실패분) 제목을 키로 쓴다. 예전엔 빈 값이 그대로
  // 키가 되면서 서로 아무 관계 없는 기사들이 한 이슈로 뭉쳤다.
  rows.forEach(r => {
    const key = r.issue || r.title || r.link;
    (byIssue[key] = byIssue[key] || []).push(r);
  });
  const groups = Object.keys(byIssue).map(title => {
    const grows = byIssue[title].slice().sort((a,b) => b.importance - a.importance);
    const majorRows = grows.filter(r => isMajorPress(r.link));
    const rep = majorRows.length ? majorRows[0] : grows[0];
    return {
      title, importance: rep.importance, sentiment: rep.sentiment, category: rep.category, summary: rep.summary,
      mainPress: rep.press, pressCount: grows.length, repTs: rep.ts, repPubTs: rep.pub_ts, repLink: rep.link,
      kwRepeat: keywordRepeatInfo(grows), rows: grows,
    };
  });
  groups.sort((a,b) => (b.importance - a.importance) || (b.kwRepeat[1] - a.kwRepeat[1]));
  return groups;
}

function dailyRows() { return NEWS_DATA.filter(r => r.date === state.currentDate); }

function renderTopTiles() {
  const dr = dailyRows();
  document.getElementById('dateText').textContent = state.currentDate || '-';

  const groups = buildIssueGroups(dr);
  const dupCount = dr.length - groups.length;
  const sentCounts = {};
  dr.forEach(r => { sentCounts[r.sentiment] = (sentCounts[r.sentiment]||0) + 1; });
  const failCount = sentCounts['판단 실패']||0;

  // 중복은 실제 목록에서 안 보이는(대표기사로 묶인) 기사라, 메인 숫자는 중복을 뺀
  // 이슈 그룹 수로 보여주고 원본 총건수/중복건수는 작게 부기한다.
  document.getElementById('statCollect').innerHTML =
    `<div class="label">수집 기사</div>
     <div class="value-line">
       <span class="value">${groups.length}건</span>
       <div class="collect-substats-block">
         <div class="sub-inline">전체 ${dr.length}건</div>
         <div class="sub-inline">중복 ${dupCount}건 <span class="sm-fail">실패 ${failCount}건</span></div>
       </div>
     </div>`;

  // 법안 목록(bills.json)은 입법 탭을 볼 때만 받으므로, 이 타일은 미리 세어 둔
  // BILL_STATS 로 그린다(목록이 아직 없어도 숫자는 정확하다).
  document.getElementById('statLaw').innerHTML =
    `<div class="label">입법 현황 <span class="era-tag">제22대</span></div>
     <div class="value-line">
       <span class="value">${BILL_STATS.total}건</span>
       <div class="law-substats-block">
         <div>입안 및 발의 ${BILL_STATS.draft}건</div>
         <div>상임위 ${BILL_STATS.committee} · 법사위 ${BILL_STATS.law} · 본회의 ${BILL_STATS.plenary}</div>
       </div>
     </div>`;

  // 모바일에서 타일을 접었을 때 대신 보여줄 한 줄 요약
  document.getElementById('statSummaryText').textContent =
    `수집 ${groups.length}건 · 입법 ${BILL_STATS.total}건 (발의 ${BILL_STATS.draft})`;

  return { dr, groups, sentCounts };
}

  const tabsRow = document.getElementById('tabsRow');

// 조직 탭은 현재 "준비중"으로 막아둬서 이 함수는 호출되지 않는다. 다시 켤 때를 위해
// 남겨두되, 대상 DOM(#orgContent)도 같이 지워진 상태라 그대로 호출하면 죽는다.
// 마크업을 되살리기 전까지는 조용히 빠져나가게 가드를 둔다.
function renderOrg() {
  const el = document.getElementById('orgContent');
  if (!el) return;
  if (!PERSONNEL_DATA.length) { el.innerHTML = "<div class='info-box'>아직 등록된 인사 이력이 없습니다.</div>"; return; }
  const groups = {};
  PERSONNEL_DATA.forEach(p => {
    const key = p.dept + '|||' + p.role;
    (groups[key] = groups[key] || {dept:p.dept, role:p.role, people:[]}).people.push(p);
  });
  let html = "";
  Object.values(groups).forEach(g => {
    g.people.sort((a,b) => (b.start||"").localeCompare(a.start||""));
    html += `<div class="org-dept-title">${g.dept} · ${g.role}</div>`;
    g.people.forEach(p => {
      const isCurrent = !p.end;
      const badge = isCurrent ? "<span class='badge-positive'>현재</span> " : "";
      const unverifiedBadge = p.verified === false
        ? ` <a href="${p.source||'#'}" target="_blank" class="badge-skipped" title="뉴스 기사에서 자동 감지된 인사입니다. 확인 후 personnel.csv의 확인상태를 '확인됨'으로 바꿔주세요.">미확인(자동감지)</a>`
        : "";
      html += `<div class="org-person-row">${badge}<b>${p.name}</b> · ${p.start||'?'} ~ ${isCurrent?'현재':p.end}${unverifiedBadge}</div>`;
    });
  });
  el.innerHTML = html;
}

function scopedRows() {
  if (state.period === 0) return dailyRows();
  const idx = allDates.indexOf(state.currentDate);
  const startIdx = Math.max(0, idx - state.period);
  const rangeSet = new Set(allDates.slice(startIdx, idx + 1));
  return NEWS_DATA.filter(r => rangeSet.has(r.date));
}

function renderNewsView(dr, allGroups) {
  const top3 = allGroups.slice(0,3);
  document.getElementById('signalItems').innerHTML = top3.map((g,i) => {
    const reasons = selectionReasons(g);
    const chips = reasons.map(r => `<span class='reason-chip-dark'>${r}</span>`).join(' ');
    return `<div class="signal-item">
      <div class="signal-item-head"><span class="signal-num">${i+1}</span><span class="chip-category-dark">${g.category}</span>
      <a href="${g.repLink}" target="_blank" style="color:inherit;text-decoration:none;"><b>${g.title}</b></a> ${chips}</div>
      <a href="${g.repLink}" target="_blank" style="text-decoration:none;color:inherit;display:block;"><div class="signal-item-body">${g.summary} (관련 보도 ${g.pressCount}건)</div></a>
    </div>`;
  }).join('');

  const scoped = scopedRows();
  // 카테고리 칩 건수도 목록에 실제 보이는 것(대표기사로 묶인 이슈 그룹) 기준으로
  // 세야 "전체 40"인데 클릭하면 20개만 보이는 것처럼 안 맞는 일이 없다.
  const scopedGroups = buildIssueGroups(scoped).filter(g => g.mainPress !== '미상');
  const catCounts = {};
  scopedGroups.forEach(g => { catCounts[g.category] = (catCounts[g.category]||0) + 1; });
  const cats = ['전체'].concat(Object.keys(catCounts).sort((a,b) => newsCategoryRank(a) - newsCategoryRank(b)));

  const topIssueByCat = {};
  allGroups.forEach(g => { if (!topIssueByCat[g.category]) topIssueByCat[g.category] = g; });

  const chipRow = document.getElementById('catChipRow');
  chipRow.innerHTML = cats.map(c => {
    let tip = c in topIssueByCat ? `${topIssueByCat[c].title} · 중요도 ${topIssueByCat[c].importance}/10` : '';
    const cnt = c === '전체' ? scopedGroups.length : catCounts[c];
    return `<button data-cat="${c.replace(/"/g,'&quot;')}" class="${state.selectedCategory===c?'active':''}" title="${tip}">${c} ${cnt}</button>`;
  }).join('');
  // 모바일에서 접었을 때도 지금 무슨 카테고리를 보고 있는지 제목 옆에 남긴다
  // ("전체"면 굳이 표시하지 않음).
  const updateNewsCurrentTag = () => {
    const c = state.selectedCategory;
    document.getElementById('newsCurrentTag').textContent =
      c === '전체' ? '' : `${c} ${catCounts[c] || 0}`;
  };
  updateNewsCurrentTag();
  chipRow.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      state.selectedCategory = btn.dataset.cat;
      state.page = 1;
      chipRow.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.cat === state.selectedCategory));
      updateNewsCurrentTag();
      renderMainList(scoped, allGroups);
    });
  });

  renderMainList(scoped, allGroups);

  // 이 패널도 카테고리 칩/목록과 같은 기준(중복 제외한 이슈 그룹)으로 센다.
  // 예전엔 원본 행(dr)을 세서 "전체 1753건"인데 칩은 "전체 728"로 어긋났다.
  const panelRows = scopedGroups;
  const dailyCatCounts = {};
  panelRows.forEach(r => { dailyCatCounts[r.category] = (dailyCatCounts[r.category]||0) + 1; });
  const renderKwRow = (catValue, rows, extraClass) => {
    const neg = rows.filter(r => r.sentiment==='부정').length;
    const neu = rows.filter(r => r.sentiment==='중립').length;
    const pos = rows.filter(r => r.sentiment==='긍정').length;
    const fail = rows.filter(r => r.sentiment==='판단 실패').length;
    const totalS = neg+neu+pos;
    let negPct=0, neuPct=0, posPct=0;
    if (totalS > 0) { negPct = Math.round(neg/totalS*100); posPct = Math.round(pos/totalS*100); neuPct = 100-negPct-posPct; }
    // 막대 안에 "577(33%)"처럼 건수와 비율을 함께 넣는다(좁은 칸은 글자를 생략).
    const seg = (pct, cnt, cls, sentiment) => pct > 0
      ? `<div class="sentiment-seg ${cls}" style="width:${pct}%;" data-cat="${catValue}" data-sentiment="${sentiment}" title="${catValue} · ${sentiment} ${cnt}건(${pct}%)">${pct >= 18 ? cnt+'('+pct+'%)' : (pct >= 9 ? cnt : '')}</div>`
      : '';
    const failTag = fail > 0
      ? ` <span class="cnt-fail kw-label-clickable" data-cat="${catValue}" data-sentiment="판단 실패" title="${catValue} · 실패만 보기">실패 ${fail}</span>`
      : '';
    return `<div class="kw-row ${extraClass||''}"><div class="kw-label"><span class="kw-label-clickable" data-cat="${catValue}" title="${catValue} 카테고리로 이동">${catValue} <span class="kw-total">${rows.length}건</span></span>${failTag}</div>
      <div class="sentiment-track">${seg(negPct,neg,'sentiment-neg','부정')}${seg(neuPct,neu,'sentiment-neu','중립')}${seg(posPct,pos,'sentiment-pos','긍정')}</div></div>`;
  };
  let sidebarHtml = panelRows.length ? renderKwRow('전체', panelRows, 'kw-row-total') + '<hr class="kw-divider">' : '';
  Object.keys(dailyCatCounts).sort((a,b) => dailyCatCounts[b]-dailyCatCounts[a]).forEach(cat => {
    sidebarHtml += renderKwRow(cat, panelRows.filter(r => r.category === cat));
  });
  // 접었을 때 제목 옆에 지금 보고 있는 카테고리를 남긴다.
  // 카테고리 칩만 눌렀을 때는 이 함수가 다시 안 돌기 때문에, 건수 표를 밖에 넘겨
  // renderMainList 에서도 같은 표시를 갱신할 수 있게 해둔다.
  sidebarTagCounts = dailyCatCounts;
  updateSidebarTag();
  const sidebarEl = document.getElementById('sidebarBars');
  sidebarEl.innerHTML = sidebarHtml;

  const applySidebarFilter = (cat, sentiment) => {
    state.selectedCategory = cat;
    state.sentiment = sentiment || '';
    state.page = 1;
    chipRow.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.cat === state.selectedCategory));
    document.getElementById('sentimentSelect').value = state.sentiment;
    renderMainList(scoped, allGroups);
  };
  sidebarEl.querySelectorAll('.kw-label-clickable, .sentiment-seg').forEach(el => {
    el.addEventListener('click', () => applySidebarFilter(el.dataset.cat, el.dataset.sentiment || ''));
  });
}

// "카테고리별 수집 현황"을 접었을 때 제목 옆에 남길 현재 선택 표시
let sidebarTagCounts = {};
function updateSidebarTag() {
  const el = document.getElementById('sidebarCurrentTag');
  if (!el) return;
  el.textContent = state.selectedCategory === '전체'
    ? '' : `${state.selectedCategory} ${sidebarTagCounts[state.selectedCategory] || 0}`;
}

function renderMainList(scoped, allGroups) {
  updateSidebarTag();
  let filtered = state.selectedCategory === '전체' ? scoped : scoped.filter(r => r.category === state.selectedCategory);
  if (state.sentiment) filtered = filtered.filter(r => r.sentiment === state.sentiment);
  if (state.search) {
    const q = state.search.toLowerCase();
    filtered = filtered.filter(r => (r.title||'').toLowerCase().includes(q) || (r.summary||'').toLowerCase().includes(q) || (r.issue||'').toLowerCase().includes(q));
  }
  let groups = buildIssueGroups(filtered).filter(g => g.mainPress !== '미상');
  if (state.sort === 'latest') {
    groups.sort((a,b) => new Date(b.rows.reduce((m,r)=> (r.ts && r.ts>m)?r.ts:m, "")).getTime() - new Date(a.rows.reduce((m,r)=> (r.ts && r.ts>m)?r.ts:m, "")).getTime());
  } else if (state.sort === 'press') {
    groups.sort((a,b) => b.pressCount - a.pressCount);
  }

  const totalCount = groups.length;
  const totalPages = Math.max(1, Math.ceil(totalCount / state.pageSize));
  if (state.page > totalPages) state.page = totalPages;
  if (state.page < 1) state.page = 1;
  const startN = (state.page - 1) * state.pageSize;
  const pageGroups = groups.slice(startN, startN + state.pageSize);

  document.getElementById('resultCaption').textContent = totalCount === 0 ? "조건에 맞는 기사가 없습니다." :
    `전체 ${totalCount}건 중 ${startN+1}~${Math.min(startN+state.pageSize,totalCount)}건 표시 (총 ${totalPages}쪽)`;
  document.getElementById('pageSizeSel').value = String(state.pageSize);

  const listEl = document.getElementById('mainListArea');
  if (!pageGroups.length) {
    listEl.innerHTML = "<div class='info-box'>조건에 맞는 기사가 없습니다.</div>";
  } else {
    listEl.innerHTML = pageGroups.map(g => {
      const bc = badgeClass(g.sentiment);
      const reasons = selectionReasons(g);
      const fineTag = extractFineAmount(g.title + " " + g.summary);
      const domain = extractDomain(g.repLink);
      const dt = fmtDt(g.repPubTs || g.repTs);
      const issueKey = (g.title + "|" + g.repLink).replace(/"/g,'&quot;');
      const isOpen = !!state.openIssues[issueKey];
      let tags = `<span class="${bc}">${g.sentiment}</span> <span class="chip-category">${g.category}</span>`;
      if (reasons.indexOf(REASON_SANCTION) !== -1) tags += " <span class='chip-tag-warn'>제재·규제</span>";
      if (fineTag) tags += ` <span class="chip-alert">${fineTag}</span>`;
      const reasonChips = reasons.map(r => `<span class='reason-chip'>${r}</span>`).join(' ');
      const related = g.rows.map(r => `<div>- [${r.press}] <a href="${r.link}" target="_blank">${r.title}</a></div>`).join('');
      const titleAttr = g.title.replace(/"/g, '&quot;');
      return `<div class="article-card">
        <div class="card-head">
          <span class="card-tags">${tags}</span>
          <a class="article-title" href="${g.repLink}" target="_blank" title="${titleAttr}">${g.title}</a>
          <span class="card-meta-group"><span class="importance-tag" title="중요도 ${g.importance}/10">${g.importance}/10</span><span class="card-meta-inline">${dt} · ${domain}</span></span>
          <button class="toggle-btn toggle-btn-inline" data-key="${issueKey}">${g.pressCount}건 ${isOpen?'▲':'▼'}</button>
        </div>
        <a href="${g.repLink}" target="_blank" class="summary-box-blue">${g.summary}</a>
        <div class="related-row">
          <div class="reason-box">${reasons.length? ("<span class='reason-label'>선별 근거</span>"+reasonChips) : ""}</div>
          <button class="toggle-btn toggle-btn-bottom" data-key="${issueKey}">유사 기사 ${g.pressCount}건 ${isOpen?'▲':'▼'}</button>
        </div>
        <div class="related-list ${isOpen?'open':''}">${related}</div>
      </div>`;
    }).join('');
    listEl.querySelectorAll('.toggle-btn').forEach(btn => {
      btn.addEventListener('click', () => { const k = btn.dataset.key; state.openIssues[k] = !state.openIssues[k]; renderMainList(scoped, allGroups); });
    });
  }

  const pg = document.getElementById('pgNav');
  const WINDOW = 10;
  const startP = Math.max(1, Math.min(state.page - Math.floor(WINDOW/2), totalPages - WINDOW + 1));
  const endP = Math.min(totalPages, startP + WINDOW - 1);
  const pageNums = [];
  for (let p = startP; p <= endP; p++) pageNums.push(p);
  let navHtml = `<button id="pgPrev" ${state.page<=1?'disabled':''}>◀</button>`;
  pageNums.forEach(p => { navHtml += `<button class="pg-num ${p===state.page?'active':''}" data-p="${p}">${p}</button>`; });
  navHtml += `<button id="pgNext" ${state.page>=totalPages?'disabled':''}>▶</button>`;
  pg.innerHTML = navHtml;
  document.getElementById('pgPrev').addEventListener('click', () => { if (state.page>1) { state.page--; renderMainList(scoped, allGroups); } });
  document.getElementById('pgNext').addEventListener('click', () => { if (state.page<totalPages) { state.page++; renderMainList(scoped, allGroups); } });
  pg.querySelectorAll('.pg-num').forEach(b => b.addEventListener('click', () => { state.page = parseInt(b.dataset.p,10); renderMainList(scoped, allGroups); }));
}

const COMMITTEE_ABBR = {
  "국회운영위원회": "운영위", "법제사법위원회": "법사위", "정무위원회": "정무위",
  "재정경제기획위원회": "재정경제기획위", "교육위원회": "교육위", "과학기술정보방송통신위원회": "과방위",
  "외교통일위원회": "외통위", "국방위원회": "국방위", "행정안전위원회": "행안위",
  "문화체육관광위원회": "문체위", "농림축산식품해양수산위원회": "농해수위",
  "산업통상자원중소벤처기업위원회": "산자위", "보건복지위원회": "복지위",
  "기후에너지환경노동위원회": "기후에너지환경노동위", "국토교통위원회": "국토위", "정보위원회": "정보위",
  "성평등가족위원회": "성평등가족위", "예산결산특별위원회": "예결위", "기후위기 특별위원회": "기후위기특위",
};
function committeeAbbr(name) {
  if (!name) return name;
  if (COMMITTEE_ABBR[name]) return COMMITTEE_ABBR[name];
  return name.endsWith("위원회") ? name.slice(0, -3) + "위" : name;
}

// 정무위/법사위/산자위/기후에너지환경노동위/재경위를 앞에 고정하고, 그 뒤는
// 산업·기업 활동과 연관도가 높은 순으로 상임위를 배치한다 (사용자 지정 순서).
const COMMITTEE_PRIORITY = [
  "정무위원회", "법제사법위원회", "산업통상자원중소벤처기업위원회",
  "기후에너지환경노동위원회", "재정경제기획위원회",
  "국토교통위원회", "과학기술정보방송통신위원회", "행정안전위원회",
  "농림축산식품해양수산위원회", "문화체육관광위원회", "보건복지위원회",
  "국방위원회", "외교통일위원회", "국회운영위원회", "교육위원회",
  "성평등가족위원회", "정보위원회", "기후위기 특별위원회", "예산결산특별위원회",
];
function committeePriorityRank(name) {
  const idx = COMMITTEE_PRIORITY.indexOf(name);
  return idx === -1 ? COMMITTEE_PRIORITY.length : idx;
}

// 제안자 문구("OOO의원(정당, 선수, 지역구) 등 N인")에서 괄호 안 인적사항만
// 주변 메타 텍스트보다 잘 보이게 별도 span으로 감싼다.
function proposerHtml(raw) {
  if (!raw) return '';
  const openIdx = raw.indexOf('(');
  if (openIdx === -1) return `<span class="meta-dim">${raw}</span>`;
  // 정당 부분에 "(前 이전정당)"처럼 괄호가 한 번 더 들어가 있을 수 있어서, 정규식
  // 대신 괄호 깊이를 세어 실제로 닫히는 지점(바깥쪽 괄호)을 찾는다.
  let depth = 0, closeIdx = -1;
  for (let i = openIdx; i < raw.length; i++) {
    if (raw[i] === '(') depth++;
    else if (raw[i] === ')') { depth--; if (depth === 0) { closeIdx = i; break; } }
  }
  if (closeIdx === -1) return `<span class="meta-dim">${raw}</span>`;
  const before = raw.slice(0, openIdx);
  const detail = raw.slice(openIdx, closeIdx + 1);
  const after = raw.slice(closeIdx + 1);
  return `<span class="proposer-detail">${before}${detail}</span><span class="meta-dim">${after}</span>`;
}

// 개별 법안 카드에 "입안 및 발의(날짜) > OO위 심사(날짜) > 법사위 심사(날짜) > 본회의 의결"
// 처럼 그 법안 자신의 진행 상황을 날짜와 함께 보여준다. 지난 단계는 흐리게+완료일,
// 지금 단계는 강조+진행중인 날짜, 아직 안 온 단계는 더 흐리게 날짜 없이 표시한다.
// 각 단계에 날짜가 그대로 찍히니 별도의 "상태변경" 배지 없이도 뭐가 바뀌었는지 보인다.
const BILL_STEP_STAGES = ["입안 및 발의", "상임위 심사", "법사위 심사", "본회의 의결"];
function billStepperHtml(b) {
  const curRank = BILL_STEP_STAGES.indexOf(b.stage);
  const steps = [
    { stage: "입안 및 발의", label: "입안 및 발의", startDt: b.proposeDate, doneDt: b.proposeDate, result: null },
    { stage: "상임위 심사", label: `${committeeAbbr(b.committee) || '상임위'} 심사`, startDt: b.committeeDt, doneDt: b.committeeDoneDt, result: b.committeeResult },
    { stage: "법사위 심사", label: "법사위 심사", startDt: b.lawDt, doneDt: b.lawDoneDt, result: b.lawResult },
    { stage: "본회의 의결", label: "본회의 의결", startDt: null, doneDt: null, result: null },
  ];
  return steps.map((s, i) => {
    const rank = BILL_STEP_STAGES.indexOf(s.stage);
    let cls, date, result;
    if (rank < curRank) { cls = 'step-done'; date = s.doneDt || s.startDt; result = s.result; }
    else if (rank === curRank) {
      // 지금 단계인데 이미 결과가 나와 있으면(대안반영폐기/부결/철회 등) 다음 단계로
      // 넘어가지 않고 여기서 끝난 것이므로, "진행중"이 아니라 "완료"로 표시한다.
      if (s.result) { cls = 'step-done'; date = s.doneDt || s.startDt; result = s.result; }
      else { cls = 'step-active'; date = s.startDt; result = null; }
    }
    else { cls = 'step-future'; date = null; result = null; }
    const resultHtml = result ? ` · ${result}` : '';
    const dateHtml = date ? `<span class="step-date">${date}</span>` : '';
    const arrow = i > 0 ? `<span class="bill-step-arrow">›</span>` : '';
    return `${arrow}<span class="bill-step ${cls}">${s.label}${resultHtml}${dateHtml}</span>`;
  }).join('');
}

const STATUS_STAGE_ORDER = ["입안 및 발의", "상임위 심사", "법사위 심사", "본회의 의결", "공포"];
const RESULT_STAGES = ["상임위 심사", "법사위 심사", "본회의 의결"]; // 세부 결과(원안가결/수정가결/폐기 등)가 나올 수 있는 단계
const RESULT_ORDER = ["심사중", "원안가결", "수정가결", "대안반영가결", "대안반영폐기", "철회", "폐기", "부결"];
function resultRank(v) {
  const idx = RESULT_ORDER.indexOf(v);
  return idx === -1 ? RESULT_ORDER.length : idx;
}

function renderBillChipRow(elId, field, stateKey, displayFn, sortFn, filterFn, onSelect, allBtnId, currentTagId) {
  displayFn = displayFn || (v => v);
  const source = filterFn ? BILL_DATA.filter(filterFn) : BILL_DATA;
  const counts = {};
  source.forEach(b => { const v = b[field] || '(미정)'; counts[v] = (counts[v]||0) + 1; });
  if (filterFn && state[stateKey] !== '전체' && !(state[stateKey] in counts)) state[stateKey] = '전체';
  const sorter = sortFn || ((a,b) => counts[b]-counts[a]);
  const row = document.getElementById(elId);
  const allBtn = allBtnId ? document.getElementById(allBtnId) : null;
  const currentTag = currentTagId ? document.getElementById(currentTagId) : null;
  // 접었을 때도 지금 뭘 골랐는지 보이게, 제목 옆에 현재 선택 표시를 남긴다
  // ("전체"일 땐 굳이 "전체 전체"라고 또 보여줄 필요 없음).
  const updateCurrentTag = () => {
    if (!currentTag) return;
    currentTag.textContent = state[stateKey] === '전체' ? '' : `${displayFn(state[stateKey])} ${counts[state[stateKey]] || 0}`;
  };
  // "전체"를 별도 버튼(allBtnId)으로 빼면 소관위원회 제목 옆에 붙여둘 수 있고,
  // 아래 칩 행에는 실제 위원회들만 남아 두 줄로 정리하기 쉬워진다.
  const values = allBtn ? Object.keys(counts).sort(sorter) : ['전체'].concat(Object.keys(counts).sort(sorter));
  const setActive = (val) => {
    row.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.val === val));
    if (allBtn) allBtn.classList.toggle('active', val === '전체');
  };
  const select = (val) => {
    state[stateKey] = val;
    state.billPage = 1;
    setActive(val);
    updateCurrentTag();
    if (onSelect) onSelect();
    renderBillList();
  };
  row.innerHTML = values.map(v => {
    const cnt = counts[v];
    return `<button data-val="${v.replace(/"/g,'&quot;')}" class="${state[stateKey]===v?'active':''}">${displayFn(v)} ${cnt}</button>`;
  }).join('');
  row.querySelectorAll('button').forEach(btn => btn.addEventListener('click', () => select(btn.dataset.val)));
  if (allBtn) {
    allBtn.textContent = `전체 ${source.length}`;
    allBtn.classList.toggle('active', state[stateKey] === '전체');
    allBtn.onclick = () => select('전체');
  }
  updateCurrentTag();
}

// 위원회(맨 위) -> 처리단계 흐름(화살표로 연결) -> 세부결과, 3단 연계 필터.
// 위 단계 선택이 아래 단계의 칩 건수를 다시 계산하게 만든다.
function renderCommitteeChipRow() {
  const starred = getStarredBills();
  const filterFn = state.billStarredOnly ? (b => starred.has(b.id)) : null;
  renderBillChipRow('billCommitteeChipRow', 'committee', 'billCommittee', committeeAbbr, (a,b) => committeePriorityRank(a) - committeePriorityRank(b), filterFn, renderStageFlowRow, 'billCommitteeAllBtn', 'committeeCurrentTag');
}

// 입안 및 발의 -> 상임위 심사 -> 법사위 심사 -> 본회의 의결 흐름을 처리상태
// 제목 옆에 한 줄짜리 압축 흐름으로 보여준다(위원회 선택에 맞춰 건수 재계산).
// 상임위/법사위/본회의 중 지금 선택된 단계의 세부 결과(원안가결/심사중 등)만
// 아래 본문에 아코디언처럼 펼쳐서 보여준다 - 동시에 여러 단계를 다 펼쳐두지
// 않아서 한 줄 흐름이 계속 짧게 유지된다.
function renderStageFlowRow() {
  const starred = getStarredBills();
  const source = BILL_DATA.filter(b =>
    (state.billCommittee === '전체' || b.committee === state.billCommittee) &&
    (!state.billStarredOnly || starred.has(b.id))
  );
  const stageCounts = {};
  source.forEach(b => { stageCounts[b.stage] = (stageCounts[b.stage] || 0) + 1; });
  if (state.billStage !== '전체' && !(state.billStage in stageCounts)) { state.billStage = '전체'; state.billResult = '전체'; }

  const RESULT_STAGE_SET = RESULT_STAGES;
  const allBtn = document.getElementById('billStageAllBtn');

  // 라벨은 짧게(입안/상임위/법사위/본회의) 두고 건수는 따로 감싼다.
  // 좁은 화면에서는 고른 칸의 건수만 남겨서 흐름이 한 줄로 유지되게 한다(CSS).
  const stageChip = (stage, label) => {
    const cnt = stageCounts[stage];
    const isActive = state.billStage === stage;
    const cntHtml = cnt !== undefined ? ` <span class="flow-cnt">${cnt}</span>` : '';
    return `<button data-stage="${stage}" class="flow-plain ${isActive?'active':''}" title="${stage}">${label}${cntHtml}</button>`;
  };

  const compactHtml = [
    stageChip('입안 및 발의', '입안'),
    `<span class="bill-step-arrow">▶</span>`,
    stageChip('상임위 심사', '상임위'),
    `<span class="bill-step-arrow">▶</span>`,
    stageChip('법사위 심사', '법사위'),
    `<span class="bill-step-arrow">▶</span>`,
    stageChip('본회의 의결', '본회의'),
  ].join('');
  const row = document.getElementById('billStatusChipRow');
  row.innerHTML = compactHtml;

  const selectStage = (stage, result) => {
    state.billStage = stage;
    state.billResult = result || '전체';
    state.billPage = 1;
    renderStageFlowRow();
    renderBillList();
  };
  row.querySelectorAll('button[data-stage]').forEach(btn => {
    // 제목 옆 ▼ 버튼을 없앴으므로, 고른 칸을 다시 누르는 것이 "접기"가 된다.
    btn.addEventListener('click', () => selectStage(
      state.billStage === btn.dataset.stage ? '전체' : btn.dataset.stage
    ));
  });
  allBtn.textContent = `전체 ${source.length}`;
  allBtn.classList.toggle('active', state.billStage === '전체');
  allBtn.onclick = () => selectStage('전체');

  // 지금 선택된 단계가 세부결과를 가질 수 있는 단계면, 그 결과 그리드만 본문에
  // 아코디언으로 펼쳐서 보여준다(선택 안 바뀌면 다른 단계 그리드는 안 보임).
  const gridArea = document.getElementById('billStageGridArea');
  if (!RESULT_STAGE_SET.includes(state.billStage)) {
    gridArea.innerHTML = '';
  } else {
    const stageSource = source.filter(b => b.stage === state.billStage);
    const resultCounts = {};
    stageSource.forEach(b => { resultCounts[b.result] = (resultCounts[b.result] || 0) + 1; });
    const results = Object.keys(resultCounts).sort((a,b) => resultRank(a) - resultRank(b));
    const grid = results.map(r => {
      const isActiveResult = state.billResult === r;
      return `<button data-result="${r}" class="${isActiveResult?'active':''}">${r} (${resultCounts[r]})</button>`;
    }).join('');
    gridArea.innerHTML = `<div class="flow-result-grid">${grid}</div>`;
    gridArea.querySelectorAll('button[data-result]').forEach(btn => {
      btn.addEventListener('click', () => selectStage(state.billStage, btn.dataset.result));
    });
  }

  // (제목 줄을 없앴으므로 "현재 선택" 별도 표시는 필요 없다 - 칩 자체가 켜져 있다)
}

function renderBills() {
  renderCommitteeChipRow();
  renderStageFlowRow();
  renderBillList();
}

function renderBillList() {
  const starred = getStarredBills();
  let filtered = state.billCommittee === '전체' ? BILL_DATA.slice() : BILL_DATA.filter(b => (b.committee || '(미정)') === state.billCommittee);
  if (state.billStage !== '전체') filtered = filtered.filter(b => b.stage === state.billStage);
  if (RESULT_STAGES.includes(state.billStage) && state.billResult !== '전체') filtered = filtered.filter(b => b.result === state.billResult);
  if (state.billStarredOnly) filtered = filtered.filter(b => starred.has(b.id));
  if (state.billSearch) {
    const q = state.billSearch.toLowerCase();
    filtered = filtered.filter(b => (b.name||'').toLowerCase().includes(q) || (b.proposer||'').toLowerCase().includes(q) || (b.summary||'').toLowerCase().includes(q));
  }
  filtered.sort((a,b) => ((b.changed?1:0) - (a.changed?1:0)) || (b.proposeDate||'').localeCompare(a.proposeDate||''));

  const totalCount = filtered.length;
  const totalPages = Math.max(1, Math.ceil(totalCount / state.billPageSize));
  if (state.billPage > totalPages) state.billPage = totalPages;
  if (state.billPage < 1) state.billPage = 1;
  const startN = (state.billPage - 1) * state.billPageSize;
  const pageBills = filtered.slice(startN, startN + state.billPageSize);

  document.getElementById('billResultCaption').textContent = totalCount === 0 ? "조건에 맞는 법안이 없습니다." :
    `전체 ${totalCount}건 중 ${startN+1}~${Math.min(startN+state.billPageSize,totalCount)}건 표시 (총 ${totalPages}쪽)`;
  document.getElementById('billPageSizeSel').value = String(state.billPageSize);

  const listEl = document.getElementById('billListArea');
  if (!pageBills.length) {
    listEl.innerHTML = "<div class='info-box'>조건에 맞는 법안이 없습니다.</div>";
  } else {
    listEl.innerHTML = pageBills.map(b => {
      const isStarred = starred.has(b.id);
      const titleAttr = (b.name||'').replace(/"/g,'&quot;');
      const summaryLink = `https://likms.assembly.go.kr/bill/bi/popup/billSummary.do?billId=${encodeURIComponent(b.id)}`;
      const summaryBox = b.summary
        ? `<a href="${summaryLink}" class="summary-box-blue bill-popup-link" data-url="${summaryLink}">${b.summary}</a>`
        : `<div class="info-box" style="opacity:0.6;font-size:0.85em;padding:8px 12px;">AI 요약 준비 중 (<a href="${summaryLink}" class="bill-popup-link" data-url="${summaryLink}">원문 보기</a>)</div>`;
      return `<div class="article-card bill-card">
        <div class="card-head bill-title-line">
          <button class="star-btn ${isStarred?'starred':''}" data-id="${b.id}" title="즐겨찾기">${isStarred?'★':'☆'}</button>
          <span class="card-tags"><span class="chip-category">${b.category || '미분류'}</span></span>
          <a class="article-title bill-popup-link" href="${summaryLink}" data-url="${summaryLink}" title="${titleAttr}">${b.name || '(제목 없음)'}</a>
          ${proposerHtml(b.proposer||b.repProposer||'')}<span class="meta-dim">${b.no?` · 의안번호 ${b.no}`:''}</span>
        </div>
        <div class="bill-stepper">${billStepperHtml(b)}</div>
        ${summaryBox}
      </div>`;
    }).join('');
    listEl.querySelectorAll('.star-btn').forEach(btn => {
      btn.addEventListener('click', () => { toggleStarredBill(btn.dataset.id); renderBillList(); });
    });
    listEl.querySelectorAll('.bill-popup-link').forEach(a => {
      a.addEventListener('click', (e) => {
        e.preventDefault();
        window.open(a.dataset.url, 'billSummaryPopup', 'width=820,height=900,scrollbars=yes,resizable=yes,noopener');
      });
    });
  }

  renderBillPagination(totalPages);
}

function renderBillPagination(totalPages) {
  const pg = document.getElementById('billPgNav');
  const WINDOW = 10;
  const startP = Math.max(1, Math.min(state.billPage - Math.floor(WINDOW/2), totalPages - WINDOW + 1));
  const endP = Math.min(totalPages, startP + WINDOW - 1);
  const pageNums = [];
  for (let p = startP; p <= endP; p++) pageNums.push(p);
  let navHtml = `<button id="billPgPrev" ${state.billPage<=1?'disabled':''}>◀</button>`;
  pageNums.forEach(p => { navHtml += `<button class="pg-num ${p===state.billPage?'active':''}" data-p="${p}">${p}</button>`; });
  navHtml += `<button id="billPgNext" ${state.billPage>=totalPages?'disabled':''}>▶</button>`;
  pg.innerHTML = navHtml;
  document.getElementById('billPgPrev').addEventListener('click', () => { if (state.billPage>1) { state.billPage--; renderBillList(); } });
  document.getElementById('billPgNext').addEventListener('click', () => { if (state.billPage<totalPages) { state.billPage++; renderBillList(); } });
  pg.querySelectorAll('.pg-num').forEach(b => b.addEventListener('click', () => { state.billPage = parseInt(b.dataset.p,10); renderBillList(); }));
}

function renderAll() {
  renderTabsAndDate();
  const { dr, groups } = renderTopTiles();

  ['view-news','view-law','view-org','view-empty'].forEach(id => document.getElementById(id).classList.remove('active'));

  if (state.activeTab === '공정위 조직') {
    document.getElementById('view-org').classList.add('active');
  } else if (state.activeTab === '입법') {
    document.getElementById('view-law').classList.add('active');
    if (billsLoaded) {
      renderBills();
    } else {
      document.getElementById('billListArea').innerHTML =
        "<div class='info-box'>법안 목록을 불러오는 중…</div>";
      ensureBills().then(() => { if (state.activeTab === '입법') renderAll(); })
        .catch(() => {
          document.getElementById('billListArea').innerHTML =
            "<div class='info-box'>법안 목록을 불러오지 못했습니다. 새로고침 해주세요.</div>";
        });
    }
  } else if (dr.length === 0) {
    document.getElementById('view-empty').classList.add('active');
  } else {
    document.getElementById('view-news').classList.add('active');
    renderNewsView(dr, groups);
  }
}

document.getElementById('datePrev').addEventListener('click', () => {
  const i = allDates.indexOf(state.currentDate);
  if (i > 0) { state.currentDate = allDates[i-1]; renderAll(); }
});
document.getElementById('dateNext').addEventListener('click', () => {
  const i = allDates.indexOf(state.currentDate);
  if (i !== -1 && i < allDates.length - 1) { state.currentDate = allDates[i+1]; renderAll(); }
});
document.getElementById('periodSelect').addEventListener('change', e => { state.period = parseInt(e.target.value,10); state.selectedCategory = '전체'; state.page = 1; renderAll(); });
document.getElementById('sortSelect').addEventListener('change', e => { state.sort = e.target.value; renderAll(); });
document.getElementById('sentimentSelect').addEventListener('change', e => { state.sentiment = e.target.value; state.page = 1; renderAll(); });
document.getElementById('searchInput').addEventListener('input', e => { state.search = e.target.value; state.page = 1; renderAll(); });
document.getElementById('billSearchInput').addEventListener('input', e => { state.billSearch = e.target.value; state.billPage = 1; renderBillList(); });
document.getElementById('billStarredToggle').addEventListener('click', () => {
  state.billStarredOnly = !state.billStarredOnly;
  state.billPage = 1;
  const btn = document.getElementById('billStarredToggle');
  btn.classList.toggle('active', state.billStarredOnly);
  btn.textContent = state.billStarredOnly ? '★ 즐겨찾기만' : '☆ 즐겨찾기만';
  renderBills(); // 위원회/처리단계 칩 건수도 즐겨찾기 기준으로 다시 계산
});
document.querySelectorAll('.filter-section-toggle').forEach(btn => {
  btn.addEventListener('click', () => {
    document.getElementById(btn.dataset.target).classList.toggle('collapsed');
  });
});
document.getElementById('billPageSizeSel').addEventListener('change', e => {
  state.billPageSize = parseInt(e.target.value, 10);
  savePageSize('bill', state.billPageSize);
  state.billPage = 1;
  renderBillList();
});
document.getElementById('signalToggleBtn').addEventListener('click', () => {
  document.getElementById('signalBox').classList.toggle('collapsed');
});
document.getElementById('pageSizeSel').addEventListener('change', e => {
  state.pageSize = parseInt(e.target.value, 10);
  savePageSize('news', state.pageSize);
  state.page = 1;
  renderAll();
});

// 모바일 전용 접기 세 가지. 접힌 상태는 브라우저에 기억시켜 새로고침해도 유지한다.
const STAT_COLLAPSE_KEY = 'statsCollapsed', NEWS_COLLAPSE_KEY = 'newsFilterCollapsed',
      SIDE_COLLAPSE_KEY = 'sidebarCollapsed';
function readFlag(key) { try { return localStorage.getItem(key) === '1'; } catch(e) { return false; } }
function writeFlag(key, on) { try { localStorage.setItem(key, on ? '1' : '0'); } catch(e) {} }

const topStatRow = document.getElementById('topStatRow');
topStatRow.classList.toggle('stats-collapsed', readFlag(STAT_COLLAPSE_KEY));
document.getElementById('statToggleBtn').addEventListener('click', () => {
  const on = topStatRow.classList.toggle('stats-collapsed');
  writeFlag(STAT_COLLAPSE_KEY, on);
});

const newsFilterSticky = document.getElementById('newsFilterSticky');
newsFilterSticky.classList.toggle('news-collapsed', readFlag(NEWS_COLLAPSE_KEY));
document.getElementById('newsFilterToggle').addEventListener('click', () => {
  const on = newsFilterSticky.classList.toggle('news-collapsed');
  writeFlag(NEWS_COLLAPSE_KEY, on);
});

const sidebarPanel = document.getElementById('sidebarPanel');
sidebarPanel.classList.toggle('side-collapsed', readFlag(SIDE_COLLAPSE_KEY));
document.getElementById('sidebarToggle').addEventListener('click', () => {
  const on = sidebarPanel.classList.toggle('side-collapsed');
  writeFlag(SIDE_COLLAPSE_KEY, on);
});

// 뉴스 탭의 sticky 필터 블록 높이를 CSS 변수로 흘려서, 오른쪽 사이드바가 그 아래에
// 붙게 한다(안 하면 사이드바가 필터 블록에 가려짐). 필터를 접거나 창 폭이 바뀌면
// 높이가 달라지므로 ResizeObserver로 계속 추적한다.
(function syncFilterHeight() {
  const el = document.getElementById('newsFilterSticky');
  if (!el) return;
  const apply = () => document.documentElement.style.setProperty(
    '--filter-h', Math.round(el.getBoundingClientRect().height) + 'px');
  apply();
  try { if (window.ResizeObserver) new ResizeObserver(apply).observe(el); } catch(e) {}
  window.addEventListener('resize', apply);
})();

// ── 데이터 로딩 ──────────────────────────────────────────────────────────
// news.json 은 열자마자, bills.json 은 입법 탭을 볼 때 받는다.
// (index.html 안에 다 넣었더니 16MB가 됐고 CDN 압축도 안 걸렸다)
function loadJson(path) {
  return fetch(path, { cache: 'no-cache' }).then(res => {
    if (!res.ok) throw new Error(path + ' → HTTP ' + res.status);
    return res.json();
  });
}

let billsLoaded = false;
let billsPromise = null;
function ensureBills() {
  if (billsLoaded) return Promise.resolve();
  if (!billsPromise) {
    billsPromise = loadJson('bills.json')
      .then(rows => { BILL_DATA = rows; billsLoaded = true; })
      // 실패한 약속을 그대로 쥐고 있으면 다시 눌러도 재시도가 안 되므로 비운다
      .catch(err => { billsPromise = null; throw err; });
  }
  return billsPromise;
}

function showLoadError(message) {
  document.getElementById('view-empty').classList.add('active');
  document.getElementById('view-empty').innerHTML =
    `<div class="info-box">${message}</div>`;
}

fillPageSizeOptions();
loadJson('news.json').then(rows => {
  NEWS_DATA = rows;
  allDates = Array.from(new Set(NEWS_DATA.map(r => r.date))).filter(Boolean).sort();
  state.currentDate = allDates.length ? allDates[allDates.length - 1] : null;
  renderAll();
  // 첫 화면을 다 그린 뒤 한가할 때 법안도 미리 받아둔다. 첫 렌더는 이미 끝난
  // 뒤라 느려지지 않고, 입법 탭을 누르면 기다림 없이 바로 뜬다.
  const whenIdle = window.requestIdleCallback || (fn => setTimeout(fn, 2000));
  whenIdle(() => { ensureBills().catch(() => {}); });
}).catch(err => {
  console.error(err);
  showLoadError('뉴스 데이터를 불러오지 못했습니다 (' + err.message + '). 새로고침 해주세요.');
});
</script>
