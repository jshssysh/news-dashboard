<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Brief</title>
<style>
:root {
  --app-primary: #ff4b4b; --app-secondary-bg: #f0f2f6; --app-text: #31333f; --app-bg: #ffffff;
  --app-border: rgba(49,51,63,0.14); --app-border-strong: rgba(49,51,63,0.22);
  --app-shadow: 0 1px 2px rgba(15,15,20,0.04), 0 1px 12px rgba(15,15,20,0.045);
  --app-shadow-hover: 0 4px 16px rgba(15,15,20,0.09);
  --ease: cubic-bezier(.2,.7,.3,1);
}
@media (prefers-color-scheme: dark) {
  :root {
    --app-primary: #ff6b6b; --app-secondary-bg: #262730; --app-text: #fafafa; --app-bg: #0e1117;
    --app-border: rgba(255,255,255,0.10); --app-border-strong: rgba(255,255,255,0.18);
    --app-shadow: 0 1px 2px rgba(0,0,0,0.25), 0 1px 14px rgba(0,0,0,0.28);
    --app-shadow-hover: 0 6px 20px rgba(0,0,0,0.35);
  }
}
* { box-sizing: border-box; }
body {
  background: var(--app-bg); color: var(--app-text); margin: 0;
  font-family: "Segoe UI","Malgun Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
a { color: inherit; }
button, select, input { font-family: inherit; }
button { cursor: pointer; background: var(--app-bg); color: var(--app-text); transition: background-color .15s var(--ease), border-color .15s var(--ease), box-shadow .15s var(--ease), transform .1s var(--ease); }
button:active { transform: translateY(1px); }
.block-container { max-width: 1100px; margin: 0 auto; padding: 28px 20px 64px; }

.app-header { display: flex; align-items: center; justify-content: center; padding: 4px 10px; border: 1px solid var(--app-border); border-radius: 10px; height: 100%; }
.app-title { font-size: 1.08em; font-weight: 800; letter-spacing: -0.3px; line-height: 1.18; }

.top-stat-row { display: flex; gap: 12px; align-items: stretch; margin-bottom: 16px; }
.tile-db { flex: 1.38 1 0; min-width: 0; }
.tile-collect { flex: 1.3 1 0; min-width: 0; }
.tile-major { flex: 0.92 1 0; min-width: 0; }
.tile-spread { flex: 1 1 0; min-width: 0; }

.db-tile { background: var(--app-secondary-bg); border: 1px solid var(--app-border); box-shadow: var(--app-shadow); border-radius: 10px; padding: 12px 16px; height: 100%; display: flex; gap: 6px; }
.db-left { flex: 0.8 1 0; display: flex; }
.db-right { flex: 2.2 1 0; display: flex; flex-direction: column; gap: 3px; justify-content: center; }
.db-tabs-row { display: flex; gap: 4px; }
.db-tabs-row button { flex: 1 1 0; min-width: 0; padding: 2px 6px; font-size: 0.7em; white-space: pre-line; line-height: 1.15; border: 1px solid var(--app-border); border-radius: 10px; min-height: 32px; }
.db-tabs-row button:hover:not(.active) { border-color: var(--app-border-strong); background: rgba(128,128,128,0.08); }
.db-tabs-row button.active { background: var(--app-primary); color: #fff; border-color: var(--app-primary); box-shadow: 0 2px 8px rgba(255,75,75,0.35); }
.db-date-row { display: flex; gap: 4px; align-items: center; }
.db-date-row button { flex: 0 0 auto; padding: 1px 10px; font-size: 0.72em; border: 1px solid var(--app-border); border-radius: 10px; }
.db-date-row button:hover { border-color: var(--app-border-strong); background: rgba(128,128,128,0.08); }
.date-pill { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; border: 1px solid var(--app-border); border-radius: 10px; padding: 1px 10px; font-weight: 600; font-size: 0.72em; white-space: nowrap; font-variant-numeric: tabular-nums; }

.stat-card { background: var(--app-secondary-bg); border: 1px solid var(--app-border); box-shadow: var(--app-shadow); border-radius: 10px; padding: 14px 16px; height: 100%; box-sizing: border-box; }
.tile-major .stat-card, .tile-spread .stat-card { padding-right: 8px; }
.stat-card .label { font-size: 0.76em; font-weight: 600; opacity: 0.62; margin-bottom: 6px; letter-spacing: 0.2px; }
.stat-card .value-line { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; row-gap: 2px; }
.stat-card .value { font-size: 1.85em; font-weight: 800; letter-spacing: -0.4px; font-variant-numeric: tabular-nums; }
.stat-card .sub-inline { font-size: 0.72em; opacity: 0.58; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat-card .sm-fail { font-size: 0.72em; color: #9c4dcc; font-weight: 700; }
.stat-card .sm-skipped { font-size: 0.72em; color: #8a6100; font-weight: 700; opacity: 0.75; }
@media (prefers-color-scheme: dark) {
  .stat-card .sm-fail { color: #c792ea; }
  .stat-card .sm-skipped { color: #d9a441; }
}

hr.thin { border: none; border-top: 1px solid var(--app-border); margin: 8px 0; }

.badge-positive, .badge-neutral, .badge-negative, .badge-fail, .badge-skipped, .chip-category, .chip-tag-warn, .chip-alert {
  display: inline-block; padding: 3px 9px; border-radius: 5px; font-weight: 700; font-size: 0.8em; letter-spacing: 0.1px; margin-right: 6px; text-decoration: none;
}
a.badge-skipped:hover { text-decoration: underline; }
.badge-positive { background-color: #e8f5e9; color: #2e7d32; }
.badge-neutral { background-color: #fff3cd; color: #8a6100; }
.badge-negative { background-color: #fdecea; color: #c62828; }
.badge-fail { background-color: #f3e5f5; color: #7b1fa2; }
.badge-skipped { background-color: rgba(128,128,128,0.18); color: var(--app-text); opacity: 0.7; }
.chip-category { background: var(--app-secondary-bg); border: 1px solid var(--app-border); }
.chip-tag-warn { background-color: #fdecea; color: #c62828; }
.chip-alert { background-color: #c62828; color: #fff; font-size: 0.76em; }
.card-meta-inline { font-size: 0.78em; opacity: 0.56; margin-left: 8px; }
.reason-chip { display: inline-block; background: var(--app-secondary-bg); padding: 2px 8px; border-radius: 5px; font-size: 0.8em; font-weight: 600; margin-right: 4px; border: 1px solid var(--app-border); }
.reason-box { border: 1px solid var(--app-border); border-radius: 8px; padding: 6px 10px; display: flex; align-items: center; flex-wrap: wrap; gap: 5px; line-height: 1.3; }
.toggle-btn { font-size: 0.82em; font-weight: 700; padding: 5px 12px; border: 1px solid var(--app-border); border-radius: 7px; background: var(--app-secondary-bg); white-space: nowrap; }
.toggle-btn:hover { border-color: var(--app-border-strong); box-shadow: var(--app-shadow); }

.star-btn { flex-shrink: 0; border: none; background: none; font-size: 1.2em; line-height: 1; padding: 0 4px 0 0; color: #d9a441; }
.star-btn.starred { color: #f0b429; }
.star-filter-btn { flex-shrink: 0; padding: 7px 12px; border: 1px solid var(--app-border); border-radius: 7px; background: var(--app-secondary-bg); font-size: 0.85em; white-space: nowrap; }
.star-filter-btn.active { background: var(--app-primary); color: #fff; border-color: var(--app-primary); }
.bill-card .card-head { margin-bottom: 6px; }

.summary-box-blue { background-color: #eaf1fc; padding: 12px 14px; border-radius: 8px; margin-bottom: 2px; font-size: 0.93em; color: #1a4d8f; display: block; text-decoration: none; line-height: 1.5; transition: background-color .15s var(--ease); }
.summary-box-blue:hover { background-color: #dbe8fa; }
@media (prefers-color-scheme: dark) {
  .summary-box-blue { background-color: rgba(255,255,255,0.05); color: #a9c6f5; }
  .summary-box-blue:hover { background-color: rgba(255,255,255,0.09); }
}
.signal-box { background-color: #12203a; border: 1px solid #1b2e50; border-radius: 12px; padding: 18px 20px; margin-bottom: 18px; box-shadow: var(--app-shadow); }
.signal-tag { display: inline-block; background-color: #24406e; color: #8ab4f8; font-size: 0.74em; font-weight: 700; letter-spacing: 0.3px; padding: 3px 9px; border-radius: 5px; }
.signal-item { margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.12); }
.signal-item:first-of-type { margin-top: 12px; padding-top: 0; border-top: none; }
.signal-num { display: inline-block; background-color: #8ab4f8; color: #0d1e36; font-weight: 800; width: 19px; height: 19px; border-radius: 50%; text-align: center; font-size: 0.74em; line-height: 19px; margin-right: 4px; flex-shrink: 0; }
.signal-item-head { color: #fff; font-size: 0.95em; display: flex; align-items: center; flex-wrap: wrap; gap: 5px; line-height: 1.4; }
.signal-item-body { color: #b9c6dc; font-size: 0.85em; margin-top: 5px; line-height: 1.5; }
.chip-category-dark { background-color: #24406e; color: #8ab4f8; font-weight: 600; padding: 2px 7px; border-radius: 5px; font-size: 0.78em; margin: 0 2px; }
.reason-chip-dark { display: inline-block; background-color: rgba(138,180,248,0.12); color: #8ab4f8; padding: 2px 8px; border-radius: 5px; font-size: 0.74em; font-weight: 600; margin-right: 4px; }

.news-filter-row { display: flex; align-items: center; gap: 10px; flex-wrap: nowrap; margin-bottom: 12px; }
.news-filter-row h5 { margin: 0; width: 230px; flex: 0 0 auto; font-size: 1.02em; font-weight: 700; letter-spacing: -0.1px; }
.news-filter-row select { width: 100px; flex: 0 0 auto; background: var(--app-secondary-bg); color: var(--app-text); border: 1px solid var(--app-border); border-radius: 7px; padding: 7px 6px; font-size: 0.85em; transition: border-color .15s var(--ease); }
.news-filter-row select.sel-sentiment { width: 110px; }
.news-filter-row select:hover, .news-filter-row input[type=text]:hover { border-color: var(--app-border-strong); }
.news-filter-row select:focus, .news-filter-row input[type=text]:focus { outline: none; border-color: var(--app-primary); }
.news-filter-row input[type=text] { flex: 1 1 auto; min-width: 0; background: var(--app-secondary-bg); color: var(--app-text); border: 1px solid var(--app-border); border-radius: 7px; padding: 7px 12px; font-size: 0.85em; transition: border-color .15s var(--ease); }

.cat-chip-row {
  display: flex; flex-wrap: nowrap; gap: 8px; margin-bottom: 12px;
  overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: thin; padding-bottom: 6px;
}
.cat-chip-row::-webkit-scrollbar { height: 5px; }
.cat-chip-row::-webkit-scrollbar-thumb { background: var(--app-border-strong); border-radius: 4px; }
.cat-chip-row::-webkit-scrollbar-track { background: transparent; }
.cat-chip-row button { flex-shrink: 0; border-radius: 20px; white-space: nowrap; padding: 6px 13px; border: 1px solid var(--app-border); background: var(--app-secondary-bg); font-size: 0.84em; font-weight: 600; }
.cat-chip-row button:hover:not(.active) { border-color: var(--app-border-strong); background: rgba(128,128,128,0.1); }
.cat-chip-row button.active { background: var(--app-primary); color: #fff; border-color: var(--app-primary); box-shadow: 0 2px 8px rgba(255,75,75,0.32); }

.layout { display: flex; gap: 28px; align-items: flex-start; }
.main-col { flex: 2.85 1 0; min-width: 0; }
.side-col {
  flex: 1 1 0; min-width: 220px;
  position: sticky; top: 20px; align-self: flex-start;
  max-height: calc(100vh - 40px); overflow-y: auto;
  scrollbar-width: thin;
}
.side-col::-webkit-scrollbar { width: 6px; }
.side-col::-webkit-scrollbar-thumb { background: var(--app-border-strong); border-radius: 4px; }
.side-col::-webkit-scrollbar-track { background: transparent; }
@media (max-width: 800px) {
  .side-col { position: static; max-height: none; overflow-y: visible; }
}
@media (max-width: 800px) { .layout { flex-direction: column; } .news-filter-row { flex-wrap: wrap; } .news-filter-row h5 { width: auto; } }

.result-caption { font-size: 0.8em; opacity: 0.6; margin-bottom: 12px; }
.sidebar-panel { background: var(--app-secondary-bg); border: 1px solid var(--app-border); box-shadow: var(--app-shadow); border-radius: 10px; padding: 16px 14px; margin-bottom: 16px; }
.sidebar-panel .panel-title { font-weight: 700; margin-bottom: 12px; font-size: 0.95em; letter-spacing: -0.1px; }
.kw-row { margin-bottom: 18px; }
.kw-row:last-child { margin-bottom: 0; }
.kw-row-total .kw-label { font-size: 0.9em; }
.kw-row-total .sentiment-track { height: 10px; }
hr.kw-divider { border: none; border-top: 1px dashed var(--app-border); margin: 0 0 16px; }
.kw-row .kw-label { font-size: 0.84em; font-weight: 700; margin-bottom: 7px; display: flex; align-items: baseline; gap: 4px; }
.kw-total { opacity: 0.6; font-weight: 500; }
.cnt-neg { color: #e05353; font-weight: 700; }
.cnt-neu { color: #d99a2b; font-weight: 700; }
.cnt-pos { color: #43a047; font-weight: 700; }
.sentiment-track { display: flex; width: 100%; height: 8px; border-radius: 8px; overflow: visible; background-color: rgba(128,128,128,0.18); }
.sentiment-seg {
    display: flex; align-items: center; justify-content: center; font-size: 0.76em; font-weight: 700; white-space: nowrap;
    -webkit-text-stroke: 3px var(--app-secondary-bg); paint-order: stroke fill; transition: width .3s var(--ease);
    text-shadow: -1px -1px 0 var(--app-secondary-bg), 1px -1px 0 var(--app-secondary-bg), -1px 1px 0 var(--app-secondary-bg), 1px 1px 0 var(--app-secondary-bg), 0 0 4px var(--app-secondary-bg);
}
.sentiment-seg:first-child { border-radius: 8px 0 0 8px; }
.sentiment-seg:last-child { border-radius: 0 8px 8px 0; }
.sentiment-neg { background-color: #e05353; color: #e05353; }
.sentiment-neu { background-color: #e0a940; color: #d99a2b; }
.sentiment-pos { background-color: #4caf82; color: #43a047; }

.pagination-row { display: flex; align-items: center; justify-content: center; gap: 4px; margin-bottom: 10px; flex-wrap: nowrap; }
.pg-top select { flex-shrink: 0; background: var(--app-secondary-bg); color: var(--app-text); border: 1px solid var(--app-border); border-radius: 6px; padding: 4px 3px; font-size: 0.78em; }
.pg-nav { display: flex; align-items: center; justify-content: center; gap: 3px; flex-wrap: nowrap; }
.pg-nav button { flex-shrink: 0; font-weight: 700; padding: 3px 3px; border: 1px solid var(--app-border); border-radius: 6px; background: var(--app-secondary-bg); min-width: 23px; font-size: 0.8em; }
.pg-nav button:hover:not(.active):not(:disabled) { border-color: var(--app-border-strong); background: rgba(128,128,128,0.1); }
.pg-nav button.active { background: var(--app-primary); color: #fff; border-color: var(--app-primary); }
.pg-nav button:disabled { opacity: 0.35; cursor: default; }

.article-card { border: 1px solid var(--app-border); border-radius: 10px; padding: 16px; margin-bottom: 14px; box-shadow: var(--app-shadow); transition: box-shadow .15s var(--ease), border-color .15s var(--ease); }
.article-card:hover { box-shadow: var(--app-shadow-hover); border-color: var(--app-border-strong); }
.card-head { display: flex; align-items: baseline; flex-wrap: nowrap; gap: 6px; line-height: 1.5; margin-bottom: 10px; }
.card-tags { flex-shrink: 0; white-space: nowrap; }
.article-title { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-meta-group { flex-shrink: 0; white-space: nowrap; display: flex; align-items: baseline; gap: 6px; }
@media (max-width: 700px) {
  .card-head { flex-wrap: wrap; line-height: 1.7; }
  .article-title { white-space: normal; overflow: visible; text-overflow: unset; flex-basis: 100%; }
}
.article-title { font-weight: 700; text-decoration: none; line-height: 1.4; }
.article-title:hover { text-decoration: underline; }
.importance-tag { color: #b8860b; font-size: 0.84em; font-weight: 600; }
.related-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
.related-list { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--app-border); display: none; }
.related-list.open { display: block; }
.related-list div { margin-bottom: 5px; font-size: 0.88em; line-height: 1.5; }
.related-list a { color: #1565c0; text-decoration: none; }
.related-list a:hover { text-decoration: underline; }
@media (prefers-color-scheme: dark) { .related-list a { color: #7aa7e0; } }

.org-dept-title { font-size: 0.96em; font-weight: 700; margin: 18px 0 10px; letter-spacing: -0.1px; }
.org-person-row { margin-bottom: 7px; font-size: 0.9em; }
.info-box { background: var(--app-secondary-bg); border: 1px solid var(--app-border); border-radius: 8px; padding: 16px; font-size: 0.9em; line-height: 1.5; }
.generated-note { font-size: 0.72em; opacity: 0.45; text-align: center; margin-top: 36px; }
.view { display: none; }
.view.active { display: block; }
</style>
</head>
<body>
<div class="block-container">

  <div class="top-stat-row">
    <div class="tile-db">
      <div class="db-tile">
        <div class="db-left"><div class="app-header"><span class="app-title">Daily<br>Brief</span></div></div>
        <div class="db-right">
          <div class="db-tabs-row" id="tabsRow"></div>
          <div class="db-date-row">
            <button id="datePrev">◀</button>
            <div class="date-pill" id="dateText"></div>
            <button id="dateNext">▶</button>
          </div>
        </div>
      </div>
    </div>
    <div class="tile-collect"><div class="stat-card" id="statCollect"></div></div>
    <div class="tile-major"><div class="stat-card" id="statMajor"></div></div>
    <div class="tile-spread"><div class="stat-card" id="statSpread"></div></div>
  </div>

  <div id="view-news" class="view">
    <hr class="thin">
    <div class="signal-box">
      <span class="signal-tag">오늘 주요 내용</span>
      <div id="signalItems"></div>
    </div>

    <div class="news-filter-row">
      <h5>카테고리별 주요뉴스</h5>
      <select id="periodSelect">
        <option value="0">오늘만</option>
        <option value="6">최근 7일</option>
        <option value="29">최근 30일</option>
      </select>
      <select id="sortSelect">
        <option value="importance">중요도순</option>
        <option value="press">보도량순</option>
        <option value="latest">최신순</option>
      </select>
      <select id="sentimentSelect" class="sel-sentiment">
        <option value="">논조 전체</option>
        <option value="긍정">긍정</option>
        <option value="중립">중립</option>
        <option value="부정">부정</option>
        <option value="판단 실패">판단 실패</option>
      </select>
      <input type="text" id="searchInput" placeholder="제목, 요약에서 검색">
    </div>

    <div class="cat-chip-row" id="catChipRow"></div>
    <hr class="thin">

    <div class="layout">
      <div class="main-col">
        <div id="mainListArea"></div>
      </div>
      <div class="side-col">
        <div class="result-caption" id="resultCaption"></div>
        <div class="sidebar-panel">
          <div class="panel-title">카테고리별 수집 현황</div>
          <div id="sidebarBars"></div>
        </div>
        <div class="pagination-row" id="paginationRow"></div>
      </div>
    </div>
  </div>

  <div id="view-law" class="view">
    <hr class="thin">
    <div class="news-filter-row">
      <h5>공정위 소관 계류 법안</h5>
      <select id="billStatusSelect">
        <option value="">처리상태 전체</option>
      </select>
      <button id="billStarredToggle" class="star-filter-btn">☆ 즐겨찾기만</button>
      <input type="text" id="billSearchInput" placeholder="법안명, 발의자에서 검색">
    </div>
    <div class="cat-chip-row" id="billChipRow"></div>
    <hr class="thin">
    <div class="result-caption" id="billResultCaption"></div>
    <div id="billListArea"></div>
    <div class="pagination-row" id="billPaginationRow"></div>
  </div>

  <div id="view-org" class="view">
    <hr class="thin">
    <div class="info-box" style="margin-bottom:16px;">부서·직책별 담당자 재임 이력 (수동 기록 · config/personnel.csv에서 직접 추가/수정 가능)</div>
    <div id="orgContent"></div>
  </div>

  <div id="view-empty" class="view">
    <hr class="thin">
    <div class="info-box">해당 날짜에 수집된 기사 데이터가 없습니다.</div>
  </div>

  <div class="generated-note">생성 시각: __GENERATED_AT__ (GitHub Actions에서 자동 생성됨)</div>
</div>

<script>
const NEWS_DATA = __NEWS_DATA_JSON__;
const PERSONNEL_DATA = __PERSONNEL_DATA_JSON__;
const BILL_DATA = __BILL_DATA_JSON__;

const STARRED_BILLS_KEY = 'starredBills';
function getStarredBills() {
  try { return new Set(JSON.parse(localStorage.getItem(STARRED_BILLS_KEY) || '[]')); }
  catch(e) { return new Set(); }
}
function toggleStarredBill(id) {
  const s = getStarredBills();
  if (s.has(id)) s.delete(id); else s.add(id);
  try { localStorage.setItem(STARRED_BILLS_KEY, JSON.stringify(Array.from(s))); } catch(e) {}
  return s;
}

const CRITICAL_KEYWORDS = ["과징금","시정명령","고발","동의의결","담합","사익편취","일감몰아주기","기술탈취"];
const FINE_AMOUNT_PATTERN = /과징금\s*([0-9][0-9,.]*)\s*(억|만)\s*원?/;

const allDates = Array.from(new Set(NEWS_DATA.map(r => r.date))).filter(Boolean).sort();

const state = {
  activeTab: '뉴스',
  currentDate: allDates.length ? allDates[allDates.length - 1] : null,
  selectedCategory: '전체',
  period: 0,
  sort: 'importance',
  sentiment: '',
  search: '',
  pageSize: 10,
  page: 1,
  openIssues: {},
  billCategory: '전체',
  billStatus: '',
  billStarredOnly: false,
  billSearch: '',
  billPage: 1,
};

function extractDomain(url) { try { return new URL(url).host.replace(/^www\./, ""); } catch(e) { return ""; } }
function extractFineAmount(text) { const m = FINE_AMOUNT_PATTERN.exec(text || ""); return m ? ("과징금 " + m[1] + m[2] + "원") : null; }
function keywordRepeatInfo(rows) {
  let bestKw = null, bestCount = 0;
  CRITICAL_KEYWORDS.forEach(kw => {
    const c = rows.filter(r => r.title.indexOf(kw) !== -1).length;
    if (c > bestCount) { bestKw = kw; bestCount = c; }
  });
  return [bestKw, bestCount];
}
function selectionReasons(g) {
  const reasons = [];
  if (g.pressCount >= 5) reasons.push("반복 보도 " + g.pressCount + "건");
  if (g.kwRepeat[0] && g.kwRepeat[1] >= 2) reasons.push("'" + g.kwRepeat[0] + "' " + g.kwRepeat[1] + "회 반복");
  if (g.category === "공정거래") reasons.push("제재·심결 신호");
  return reasons;
}
function badgeClass(sentiment) { return {'긍정':'badge-positive','부정':'badge-negative','판단 실패':'badge-fail','미분석':'badge-skipped'}[sentiment] || 'badge-neutral'; }
function fmtDt(ts) {
  if (!ts) return "";
  const d = new Date(ts);
  const mm = String(d.getMonth()+1).padStart(2,"0"), dd = String(d.getDate()).padStart(2,"0");
  const hh = String(d.getHours()).padStart(2,"0"), mi = String(d.getMinutes()).padStart(2,"0");
  return mm + "." + dd + " " + hh + ":" + mi;
}

function buildIssueGroups(rows) {
  const byIssue = {};
  rows.forEach(r => { (byIssue[r.issue] = byIssue[r.issue] || []).push(r); });
  const groups = Object.keys(byIssue).map(title => {
    const grows = byIssue[title].slice().sort((a,b) => b.importance - a.importance);
    const rep = grows[0];
    return {
      title, importance: rep.importance, sentiment: rep.sentiment, category: rep.category, summary: rep.summary,
      mainPress: rep.press, pressCount: grows.length, repTs: rep.ts, repPubTs: rep.pub_ts, repLink: rep.link,
      kwRepeat: keywordRepeatInfo(grows), rows: grows,
    };
  });
  groups.sort((a,b) => (b.importance - a.importance) || (b.kwRepeat[1] - a.kwRepeat[1]));
  return groups;
}

function dailyRows() { return NEWS_DATA.filter(r => r.date === state.currentDate); }

function renderTopTiles() {
  const dr = dailyRows();
  document.getElementById('dateText').textContent = state.currentDate || '-';

  const groups = buildIssueGroups(dr);
  const majorCount = dr.filter(r => r.importance >= 6).length;
  const spreadGroups = groups.filter(g => g.pressCount >= 5);
  const dupCount = dr.length - groups.length;
  const sentCounts = {};
  dr.forEach(r => { sentCounts[r.sentiment] = (sentCounts[r.sentiment]||0) + 1; });
  const failCount = sentCounts['판단 실패']||0;
  const skippedCount = sentCounts['미분석']||0;
  let spreadCaption = "";
  if (groups.length) {
    let most = groups[0];
    groups.forEach(g => { if (g.pressCount > most.pressCount) most = g; });
    spreadCaption = most.title;
    if (spreadCaption.length > 16) spreadCaption = spreadCaption.slice(0,16) + "…";
  }

  const skippedTag = skippedCount > 0 ? `<span class="sm-skipped">미분석(테스트) ${skippedCount}</span>` : '';
  document.getElementById('statCollect').innerHTML =
    `<div class="label">수집 기사</div><div class="value-line"><span class="value">${dr.length}건</span><span class="sub-inline">중복 ${dupCount}건</span><span class="sm-fail">판단실패 ${failCount}</span>${skippedTag}</div>`;
  document.getElementById('statMajor').innerHTML =
    `<div class="label">주요 뉴스</div><div class="value-line"><span class="value">${majorCount}건</span><span class="sub-inline">AI 판단 기준</span></div>`;
  document.getElementById('statSpread').innerHTML =
    `<div class="label">보도 확산</div><div class="value-line"><span class="value">${spreadGroups.length}건</span><span class="sub-inline">${spreadCaption} 등</span></div>`;

  return { dr, groups, sentCounts };
}

function renderTabsAndDate() {
  const tabsRow = document.getElementById('tabsRow');
  const tabs = [['뉴스','뉴스'], ['입법','입법'], ['공정위\n조직','공정위 조직']];
  tabsRow.innerHTML = tabs.map(([label, value]) =>
    `<button data-value="${value}" class="${state.activeTab===value?'active':''}" style="white-space:pre-line;">${label}</button>`
  ).join('');
  tabsRow.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => { state.activeTab = btn.dataset.value; renderAll(); });
  });
}

function renderOrg() {
  const el = document.getElementById('orgContent');
  if (!PERSONNEL_DATA.length) { el.innerHTML = "<div class='info-box'>아직 등록된 인사 이력이 없습니다.</div>"; return; }
  const groups = {};
  PERSONNEL_DATA.forEach(p => {
    const key = p.dept + '|||' + p.role;
    (groups[key] = groups[key] || {dept:p.dept, role:p.role, people:[]}).people.push(p);
  });
  let html = "";
  Object.values(groups).forEach(g => {
    g.people.sort((a,b) => (b.start||"").localeCompare(a.start||""));
    html += `<div class="org-dept-title">${g.dept} · ${g.role}</div>`;
    g.people.forEach(p => {
      const isCurrent = !p.end;
      const badge = isCurrent ? "<span class='badge-positive'>현재</span> " : "";
      const unverifiedBadge = p.verified === false
        ? ` <a href="${p.source||'#'}" target="_blank" class="badge-skipped" title="뉴스 기사에서 자동 감지된 인사입니다. 확인 후 personnel.csv의 확인상태를 '확인됨'으로 바꿔주세요.">미확인(자동감지)</a>`
        : "";
      html += `<div class="org-person-row">${badge}<b>${p.name}</b> · ${p.start||'?'} ~ ${isCurrent?'현재':p.end}${unverifiedBadge}</div>`;
    });
  });
  el.innerHTML = html;
}

function scopedRows() {
  if (state.period === 0) return dailyRows();
  const idx = allDates.indexOf(state.currentDate);
  const startIdx = Math.max(0, idx - state.period);
  const rangeSet = new Set(allDates.slice(startIdx, idx + 1));
  return NEWS_DATA.filter(r => rangeSet.has(r.date));
}

function renderNewsView(dr, allGroups) {
  const top3 = allGroups.slice(0,3);
  document.getElementById('signalItems').innerHTML = top3.map((g,i) => {
    const reasons = selectionReasons(g);
    const chips = reasons.map(r => `<span class='reason-chip-dark'>${r}</span>`).join(' ');
    return `<div class="signal-item">
      <div class="signal-item-head"><span class="signal-num">${i+1}</span><span class="chip-category-dark">${g.category}</span>
      <a href="${g.repLink}" target="_blank" style="color:inherit;text-decoration:none;"><b>${g.title}</b></a> ${chips}</div>
      <a href="${g.repLink}" target="_blank" style="text-decoration:none;color:inherit;display:block;"><div class="signal-item-body">${g.summary} (관련 보도 ${g.pressCount}건)</div></a>
    </div>`;
  }).join('');

  const scoped = scopedRows();
  const catCounts = {};
  scoped.forEach(r => { catCounts[r.category] = (catCounts[r.category]||0) + 1; });
  const cats = ['전체'].concat(Object.keys(catCounts).sort((a,b) => catCounts[b]-catCounts[a]));

  const topIssueByCat = {};
  allGroups.forEach(g => { if (!topIssueByCat[g.category]) topIssueByCat[g.category] = g; });

  const chipRow = document.getElementById('catChipRow');
  chipRow.innerHTML = cats.map(c => {
    let tip = c in topIssueByCat ? `${topIssueByCat[c].title} · 중요도 ${topIssueByCat[c].importance}/10` : '';
    const cnt = c === '전체' ? scoped.length : catCounts[c];
    return `<button data-cat="${c.replace(/"/g,'&quot;')}" class="${state.selectedCategory===c?'active':''}" title="${tip}">${c} ${cnt}</button>`;
  }).join('');
  chipRow.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      state.selectedCategory = btn.dataset.cat;
      state.page = 1;
      chipRow.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.cat === state.selectedCategory));
      renderMainList(scoped, allGroups);
    });
  });

  renderMainList(scoped, allGroups);

  const dailyCatCounts = {};
  dr.forEach(r => { dailyCatCounts[r.category] = (dailyCatCounts[r.category]||0) + 1; });
  const renderKwRow = (label, rows, extraClass) => {
    const neg = rows.filter(r => r.sentiment==='부정').length;
    const neu = rows.filter(r => r.sentiment==='중립').length;
    const pos = rows.filter(r => r.sentiment==='긍정').length;
    const totalS = neg+neu+pos;
    let negPct=0, neuPct=0, posPct=0;
    if (totalS > 0) { negPct = Math.round(neg/totalS*100); posPct = Math.round(pos/totalS*100); neuPct = 100-negPct-posPct; }
    const seg = (pct, cls) => pct > 0 ? `<div class="sentiment-seg ${cls}" style="width:${pct}%;">${pct}%</div>` : '';
    return `<div class="kw-row ${extraClass||''}"><div class="kw-label">${label} <span class="kw-total">${rows.length}건</span> / <span class="cnt-neg">${neg}</span> <span class="cnt-neu">${neu}</span> <span class="cnt-pos">${pos}</span></div>
      <div class="sentiment-track">${seg(negPct,'sentiment-neg')}${seg(neuPct,'sentiment-neu')}${seg(posPct,'sentiment-pos')}</div></div>`;
  };
  let sidebarHtml = dr.length ? renderKwRow('전체', dr, 'kw-row-total') + '<hr class="kw-divider">' : '';
  Object.keys(dailyCatCounts).sort((a,b) => dailyCatCounts[b]-dailyCatCounts[a]).forEach(cat => {
    sidebarHtml += renderKwRow(cat, dr.filter(r => r.category === cat));
  });
  document.getElementById('sidebarBars').innerHTML = sidebarHtml;
}

function renderMainList(scoped, allGroups) {
  let filtered = state.selectedCategory === '전체' ? scoped : scoped.filter(r => r.category === state.selectedCategory);
  if (state.sentiment) filtered = filtered.filter(r => r.sentiment === state.sentiment);
  if (state.search) {
    const q = state.search.toLowerCase();
    filtered = filtered.filter(r => (r.title||'').toLowerCase().includes(q) || (r.summary||'').toLowerCase().includes(q) || (r.issue||'').toLowerCase().includes(q));
  }
  let groups = buildIssueGroups(filtered).filter(g => g.mainPress !== '미상');
  if (state.sort === 'latest') {
    groups.sort((a,b) => new Date(b.rows.reduce((m,r)=> (r.ts && r.ts>m)?r.ts:m, "")).getTime() - new Date(a.rows.reduce((m,r)=> (r.ts && r.ts>m)?r.ts:m, "")).getTime());
  } else if (state.sort === 'press') {
    groups.sort((a,b) => b.pressCount - a.pressCount);
  }

  const totalCount = groups.length;
  const totalPages = Math.max(1, Math.ceil(totalCount / state.pageSize));
  if (state.page > totalPages) state.page = totalPages;
  if (state.page < 1) state.page = 1;
  const startN = (state.page - 1) * state.pageSize;
  const pageGroups = groups.slice(startN, startN + state.pageSize);

  document.getElementById('resultCaption').textContent = totalCount === 0 ? "조건에 맞는 기사가 없습니다." :
    `전체 ${totalCount}건 중 ${startN+1}~${Math.min(startN+state.pageSize,totalCount)}건 표시 (총 ${totalPages}쪽)`;

  const listEl = document.getElementById('mainListArea');
  if (!pageGroups.length) {
    listEl.innerHTML = "<div class='info-box'>조건에 맞는 기사가 없습니다.</div>";
  } else {
    listEl.innerHTML = pageGroups.map(g => {
      const bc = badgeClass(g.sentiment);
      const reasons = selectionReasons(g);
      const fineTag = extractFineAmount(g.title + " " + g.summary);
      const domain = extractDomain(g.repLink);
      const dt = fmtDt(g.repPubTs || g.repTs);
      const issueKey = (g.title + "|" + g.repLink).replace(/"/g,'&quot;');
      const isOpen = !!state.openIssues[issueKey];
      let tags = `<span class="${bc}">${g.sentiment}</span> <span class="chip-category">${g.category}</span>`;
      if (reasons.indexOf('제재·심결 신호') !== -1) tags += " <span class='chip-tag-warn'>제재·규제</span>";
      if (fineTag) tags += ` <span class="chip-alert">${fineTag}</span>`;
      const reasonChips = reasons.map(r => `<span class='reason-chip'>${r}</span>`).join(' ');
      const related = g.rows.map(r => `<div>- [${r.press}] <a href="${r.link}" target="_blank">${r.title}</a></div>`).join('');
      const titleAttr = g.title.replace(/"/g, '&quot;');
      return `<div class="article-card">
        <div class="card-head">
          <span class="card-tags">${tags}</span>
          <a class="article-title" href="${g.repLink}" target="_blank" title="${titleAttr}">${g.title}</a>
          <span class="card-meta-group"><span class="importance-tag">중요도 ${g.importance}/10</span><span class="card-meta-inline">${dt} · ${domain} · 총 보도 매체 ${g.pressCount}개</span></span>
        </div>
        <a href="${g.repLink}" target="_blank" class="summary-box-blue">${g.summary}</a>
        <div class="related-row">
          <div class="reason-box">${reasons.length? ("선별 근거 "+reasonChips) : ""}</div>
          <button class="toggle-btn" data-key="${issueKey}">유사 기사 ${g.pressCount}건 ${isOpen?'▲':'▼'}</button>
        </div>
        <div class="related-list ${isOpen?'open':''}">${related}</div>
      </div>`;
    }).join('');
    listEl.querySelectorAll('.toggle-btn').forEach(btn => {
      btn.addEventListener('click', () => { const k = btn.dataset.key; state.openIssues[k] = !state.openIssues[k]; renderMainList(scoped, allGroups); });
    });
  }

  const pg = document.getElementById('paginationRow');
  const WINDOW = 3;
  const startP = Math.max(1, Math.min(state.page - Math.floor(WINDOW/2), totalPages - WINDOW + 1));
  const endP = Math.min(totalPages, startP + WINDOW - 1);
  const pageNums = [];
  for (let p = startP; p <= endP; p++) pageNums.push(p);
  let navHtml = `<button id="pgPrev" ${state.page<=1?'disabled':''}>◀</button>`;
  pageNums.forEach(p => { navHtml += `<button class="pg-num ${p===state.page?'active':''}" data-p="${p}">${p}</button>`; });
  navHtml += `<button id="pgNext" ${state.page>=totalPages?'disabled':''}>▶</button>`;
  pg.innerHTML = `
    <div class="pg-top"><select id="pageSizeSel"><option value="10" ${state.pageSize===10?'selected':''}>10개</option><option value="20" ${state.pageSize===20?'selected':''}>20개</option><option value="50" ${state.pageSize===50?'selected':''}>50개</option></select></div>
    <div class="pg-nav">${navHtml}</div>
  `;
  document.getElementById('pageSizeSel').addEventListener('change', e => { state.pageSize = parseInt(e.target.value,10); state.page = 1; renderMainList(scoped, allGroups); });
  document.getElementById('pgPrev').addEventListener('click', () => { if (state.page>1) { state.page--; renderMainList(scoped, allGroups); } });
  document.getElementById('pgNext').addEventListener('click', () => { if (state.page<totalPages) { state.page++; renderMainList(scoped, allGroups); } });
  pg.querySelectorAll('.pg-num').forEach(b => b.addEventListener('click', () => { state.page = parseInt(b.dataset.p,10); renderMainList(scoped, allGroups); }));
}

function renderBills() {
  const catCounts = {};
  BILL_DATA.forEach(b => { catCounts[b.category] = (catCounts[b.category]||0) + 1; });
  const cats = ['전체'].concat(Object.keys(catCounts).sort((a,b) => catCounts[b]-catCounts[a]));

  const chipRow = document.getElementById('billChipRow');
  chipRow.innerHTML = cats.map(c => {
    const cnt = c === '전체' ? BILL_DATA.length : catCounts[c];
    return `<button data-cat="${c.replace(/"/g,'&quot;')}" class="${state.billCategory===c?'active':''}">${c} ${cnt}</button>`;
  }).join('');
  chipRow.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      state.billCategory = btn.dataset.cat;
      state.billPage = 1;
      chipRow.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.cat === state.billCategory));
      renderBillList();
    });
  });

  const statusSel = document.getElementById('billStatusSelect');
  const statuses = Array.from(new Set(BILL_DATA.map(b => b.status))).sort();
  statusSel.innerHTML = '<option value="">처리상태 전체</option>' + statuses.map(s =>
    `<option value="${s}" ${state.billStatus===s?'selected':''}>${s}</option>`
  ).join('');

  renderBillList();
}

function renderBillList() {
  const starred = getStarredBills();
  let filtered = state.billCategory === '전체' ? BILL_DATA.slice() : BILL_DATA.filter(b => b.category === state.billCategory);
  if (state.billStatus) filtered = filtered.filter(b => b.status === state.billStatus);
  if (state.billStarredOnly) filtered = filtered.filter(b => starred.has(b.id));
  if (state.billSearch) {
    const q = state.billSearch.toLowerCase();
    filtered = filtered.filter(b => (b.name||'').toLowerCase().includes(q) || (b.proposer||'').toLowerCase().includes(q));
  }
  filtered.sort((a,b) => (b.changed - a.changed) || (b.proposeDate||'').localeCompare(a.proposeDate||''));

  const totalCount = filtered.length;
  const totalPages = Math.max(1, Math.ceil(totalCount / state.pageSize));
  if (state.billPage > totalPages) state.billPage = totalPages;
  if (state.billPage < 1) state.billPage = 1;
  const startN = (state.billPage - 1) * state.pageSize;
  const pageBills = filtered.slice(startN, startN + state.pageSize);

  document.getElementById('billResultCaption').textContent = totalCount === 0 ? "조건에 맞는 법안이 없습니다." :
    `전체 ${totalCount}건 중 ${startN+1}~${Math.min(startN+state.pageSize,totalCount)}건 표시 (총 ${totalPages}쪽)`;

  const listEl = document.getElementById('billListArea');
  if (!pageBills.length) {
    listEl.innerHTML = "<div class='info-box'>조건에 맞는 법안이 없습니다.</div>";
  } else {
    listEl.innerHTML = pageBills.map(b => {
      const isStarred = starred.has(b.id);
      const changedTag = b.changed ? `<span class="chip-alert">상태변경</span>` : '';
      const metaParts = [b.no ? `의안번호 ${b.no}` : '', b.committee || '', b.proposeDate ? `제안일 ${b.proposeDate}` : ''].filter(Boolean).join(' · ');
      const titleAttr = (b.name||'').replace(/"/g,'&quot;');
      return `<div class="article-card bill-card">
        <div class="card-head">
          <button class="star-btn ${isStarred?'starred':''}" data-id="${b.id}" title="즐겨찾기">${isStarred?'★':'☆'}</button>
          <span class="card-tags"><span class="chip-category">${b.category}</span><span class="badge-neutral">${b.status}</span>${changedTag}</span>
          <a class="article-title" href="${b.link}" target="_blank" title="${titleAttr}">${b.name}</a>
        </div>
        <div class="card-meta-inline" style="margin-left:0;">${b.proposer||b.repProposer||''}${metaParts?(' · '+metaParts):''}</div>
      </div>`;
    }).join('');
    listEl.querySelectorAll('.star-btn').forEach(btn => {
      btn.addEventListener('click', () => { toggleStarredBill(btn.dataset.id); renderBillList(); });
    });
  }

  renderBillPagination(totalPages);
}

function renderBillPagination(totalPages) {
  const pg = document.getElementById('billPaginationRow');
  const WINDOW = 3;
  const startP = Math.max(1, Math.min(state.billPage - Math.floor(WINDOW/2), totalPages - WINDOW + 1));
  const endP = Math.min(totalPages, startP + WINDOW - 1);
  const pageNums = [];
  for (let p = startP; p <= endP; p++) pageNums.push(p);
  let navHtml = `<button id="billPgPrev" ${state.billPage<=1?'disabled':''}>◀</button>`;
  pageNums.forEach(p => { navHtml += `<button class="pg-num ${p===state.billPage?'active':''}" data-p="${p}">${p}</button>`; });
  navHtml += `<button id="billPgNext" ${state.billPage>=totalPages?'disabled':''}>▶</button>`;
  pg.innerHTML = `<div class="pg-nav">${navHtml}</div>`;
  document.getElementById('billPgPrev').addEventListener('click', () => { if (state.billPage>1) { state.billPage--; renderBillList(); } });
  document.getElementById('billPgNext').addEventListener('click', () => { if (state.billPage<totalPages) { state.billPage++; renderBillList(); } });
  pg.querySelectorAll('.pg-num').forEach(b => b.addEventListener('click', () => { state.billPage = parseInt(b.dataset.p,10); renderBillList(); }));
}

function renderAll() {
  renderTabsAndDate();
  const { dr, groups } = renderTopTiles();

  ['view-news','view-law','view-org','view-empty'].forEach(id => document.getElementById(id).classList.remove('active'));

  if (state.activeTab === '공정위 조직') {
    document.getElementById('view-org').classList.add('active');
    renderOrg();
  } else if (state.activeTab === '입법') {
    document.getElementById('view-law').classList.add('active');
    renderBills();
  } else if (dr.length === 0) {
    document.getElementById('view-empty').classList.add('active');
  } else {
    document.getElementById('view-news').classList.add('active');
    renderNewsView(dr, groups);
  }
}

document.getElementById('datePrev').addEventListener('click', () => {
  const i = allDates.indexOf(state.currentDate);
  if (i > 0) { state.currentDate = allDates[i-1]; renderAll(); }
});
document.getElementById('dateNext').addEventListener('click', () => {
  const i = allDates.indexOf(state.currentDate);
  if (i !== -1 && i < allDates.length - 1) { state.currentDate = allDates[i+1]; renderAll(); }
});
document.getElementById('periodSelect').addEventListener('change', e => { state.period = parseInt(e.target.value,10); state.selectedCategory = '전체'; state.page = 1; renderAll(); });
document.getElementById('sortSelect').addEventListener('change', e => { state.sort = e.target.value; renderAll(); });
document.getElementById('sentimentSelect').addEventListener('change', e => { state.sentiment = e.target.value; state.page = 1; renderAll(); });
document.getElementById('searchInput').addEventListener('input', e => { state.search = e.target.value; state.page = 1; renderAll(); });
document.getElementById('billStatusSelect').addEventListener('change', e => { state.billStatus = e.target.value; state.billPage = 1; renderBillList(); });
document.getElementById('billSearchInput').addEventListener('input', e => { state.billSearch = e.target.value; state.billPage = 1; renderBillList(); });
document.getElementById('billStarredToggle').addEventListener('click', () => {
  state.billStarredOnly = !state.billStarredOnly;
  state.billPage = 1;
  const btn = document.getElementById('billStarredToggle');
  btn.classList.toggle('active', state.billStarredOnly);
  btn.textContent = state.billStarredOnly ? '★ 즐겨찾기만' : '☆ 즐겨찾기만';
  renderBillList();
});

renderAll();
</script>
</body>
</html>
