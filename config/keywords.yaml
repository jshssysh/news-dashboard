# 검색 키워드 설정
#
# 이 파일은 GitHub 웹사이트에서 직접 열어 수정할 수 있습니다.
# (이 파일 페이지에서 연필 모양 "Edit this file" 아이콘 클릭 → 내용 수정 → 아래
#  "Commit changes" 버튼 클릭. 터미널이나 토큰 없이 바로 반영됩니다.)
#
# 형식: "검색어": "분류"
#   - 검색어 뒤에 "-단어"를 붙이면 그 단어가 포함된 기사는 검색 결과에서 제외됩니다.
#   - 분류(카테고리)는 아래 10개 중 하나를 정확히 그대로 적어야 합니다:
#     삼성그룹, 삼성물산, 공정위/정책, 부당지원, 갑을관계, 동반성장, 지배구조, 산업동향, 제재·심결, 그린·AI워싱
#
# 새 키워드를 추가하려면 아래처럼 한 줄을 더 넣으면 됩니다:
#   "새 검색어": "부당지원"
#
# 아래 목록은 삼성 그룹 전용 키워드(기존)에, 공정거래위원회 감시 도구들이 흔히 쓰는
# 일반 키워드 그룹을 참고해서 대폭 보완한 버전입니다. 키워드가 많아진 만큼
# 하루 수집 기사 수와 Gemini 분석 비용도 함께 늘어난다는 점 참고해주세요.

