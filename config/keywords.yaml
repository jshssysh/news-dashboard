# 검색 키워드 설정
#
# 이 파일은 GitHub 웹사이트에서 직접 열어 수정할 수 있습니다.
# (이 파일 페이지에서 연필 모양 "Edit this file" 아이콘 클릭 → 내용 수정 → 아래
#  "Commit changes" 버튼 클릭. 터미널이나 토큰 없이 바로 반영됩니다.)
#
# 형식: "검색어": "분류"
#   - 검색어 뒤에 "-단어"를 붙이면 그 단어가 포함된 기사는 검색 결과에서 제외됩니다.
#   - 분류(카테고리)는 아래 8개 중 하나를 정확히 그대로 적어야 합니다:
#     삼성그룹, 삼성물산, 공정위/정책, 부당지원, 갑을관계, 동반성장, 지배구조, 산업동향
#
# 새 키워드를 추가하려면 아래처럼 한 줄을 더 넣으면 됩니다:
#   "새 검색어": "부당지원"

keywords:
  "공정거래 -부동산 -분양 -아파트 -지역화폐": "공정위/정책"
  "내부거래 -부동산 -아파트": "부당지원"
  "하도급 -부동산 -분양 -건설현장": "갑을관계"
  "상생협력 -농축산 -지자체": "동반성장"
  "상법 -강의 -시험": "지배구조"
  "지배구조": "지배구조"
  "종합상사 -채용": "산업동향"
  "삼성": "삼성그룹"
  "삼성 계열분리": "삼성그룹"
  "일감몰아주기": "부당지원"
  "웰스토리": "삼성그룹"
  "삼우종합건축사사무소": "삼성그룹"
  "레이크사이드cc": "삼성그룹"
  "삼성물산 -래미안 -분양": "삼성물산"
