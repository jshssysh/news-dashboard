# 검색 키워드 설정
#
# 이 파일은 GitHub 웹사이트에서 직접 열어 수정할 수 있습니다.
# (이 파일 페이지에서 연필 모양 "Edit this file" 아이콘 클릭 → 내용 수정 → 아래
#  "Commit changes" 버튼 클릭. 터미널이나 토큰 없이 바로 반영됩니다.)
#
# 형식: "검색어": "분류"
#   - 검색어 뒤에 "-단어"를 붙이면 그 단어가 포함된 기사는 검색 결과에서 제외됩니다.
#   - 분류(카테고리)는 아래 목록 중 하나를 정확히 그대로 적어야 합니다:
#     공정거래, 내부거래, 지배구조, 상생, 하도급, 상법, 시민단체, 노동, 기타,
#     그린·AI워싱, 삼성그룹, 삼성물산
#   (공정거래~기타 9개는 사용자가 정리한 감시 분류표 기준. 그린·AI워싱은 기존에
#    운영 중이던 별도 감시 주제라 그대로 유지. 삼성그룹/삼성물산은 대시보드에서
#    항상 숨겨지는 내부 추적용 카테고리로 이번 재분류와 무관하게 유지.)
#
# 새 키워드를 추가하려면 아래처럼 한 줄을 더 넣으면 됩니다:
#   "새 검색어": "공정거래"
#
# 키워드가 많아질수록 하루 수집 기사 수와 Gemini 분석 비용도 함께 늘어난다는 점 참고해주세요.

