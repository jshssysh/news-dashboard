# 입법(계류 법안) 카테고리 분류 키워드 설정
#
# 이 파일은 GitHub 웹사이트에서 직접 열어 수정할 수 있습니다.
#
# collect_bills.py는 국회 전체 계류 법안을 다 가져온 뒤(검색 필터 없음),
# 법안명에 아래 키워드가 포함돼 있으면 그 카테고리로 분류합니다.
# 어떤 키워드에도 안 걸리면 "기타"로 분류됩니다.
#
# 형식: "법안명에 포함될 문구": "분류"
#
# 새 분류 규칙을 추가하려면 아래처럼 한 줄을 더 넣으면 됩니다:
#   "새 문구": "새 분류"

keywords:
  "독점규제 및 공정거래": "공정거래법"
  "하도급거래": "하도급법"
  "가맹사업거래": "가맹사업법"
  "대규모유통업": "대규모유통업법"
  "대리점거래": "대리점법"
  "대·중소기업 상생협력": "상생협력법"
  "약관의 규제": "약관법"
  "전자상거래": "전자상거래법"
  "표시·광고": "표시광고법"
  "소비자기본법": "소비자기본법"
