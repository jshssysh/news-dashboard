# 입법(계류 법안) 검색 키워드 설정
#
# 이 파일은 GitHub 웹사이트에서 직접 열어 수정할 수 있습니다.
#
# 형식: "법안명에 포함될 검색어": "분류"
#   - 국회 열린국회정보 Open API(계류의안)의 BILL_NAME 파라미터로 그대로 검색됩니다.
#   - 분류는 공정위 소관 법률 기준으로 구성했습니다.
#
# 새 키워드를 추가하려면 아래처럼 한 줄을 더 넣으면 됩니다:
#   "새 검색어": "기타"

keywords:
  "독점규제 및 공정거래": "공정거래법"
  "하도급거래": "하도급법"
  "가맹사업거래": "가맹사업법"
  "대규모유통업": "대규모유통업법"
  "대리점거래": "대리점법"
  "대·중소기업 상생협력": "상생협력법"
  "약관의 규제": "약관법"
  "전자상거래": "전자상거래법"
  "표시·광고": "표시광고법"
  "소비자기본법": "소비자기본법"
